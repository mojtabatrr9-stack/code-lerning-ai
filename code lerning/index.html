/* ===== theme.css ===== */
/* =====================================================================
   هوشیکا · سیستم طراحی
   ===================================================================== */
:root {
  --bg: #05091a;
  --bg-2: #081026;
  --bg-3: #0c1730;
  --panel: rgba(17, 29, 56, 0.66);
  --panel-2: rgba(12, 22, 44, 0.82);
  --line: rgba(120, 170, 255, 0.16);
  --line-2: rgba(120, 170, 255, 0.32);
  --ink: #eaf3ff;
  --ink-2: #c3d4ee;
  --muted: #93a7c9;
  --cyan: #4de2ff;
  --violet: #8b7dff;
  --lime: #9bff7a;
  --amber: #ffc94d;
  --pink: #ff7bb0;
  --danger: #ff6b6b;
  --font-display: Lalezar, system-ui, sans-serif;
  --font-body: system-ui, 'Segoe UI', Tahoma, sans-serif;
  --font-mono: Consolas, 'Courier New', ui-monospace, monospace;
  --r-sm: 10px; --r: 16px; --r-lg: 22px; --r-xl: 30px;
  --sh-1: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
  --sh-2: 0 26px 60px -22px rgba(0, 0, 0, 0.85);
  --glow: 0 0 34px rgba(77, 226, 255, 0.22);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 45% at 12% 6%, rgba(77, 226, 255, 0.13), transparent 62%),
    radial-gradient(ellipse 55% 42% at 88% 12%, rgba(139, 125, 255, 0.14), transparent 62%),
    radial-gradient(ellipse 70% 50% at 50% 108%, rgba(155, 255, 122, 0.08), transparent 60%),
    linear-gradient(180deg, #05091a, #060c1f 45%, #040814);
}
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.35;
  background-image:
    linear-gradient(rgba(120, 170, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 170, 255, 0.05) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 78%);
}
.fx-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.fx-glow {
  position: fixed; width: 420px; height: 420px; margin: -210px 0 0 -210px; z-index: 0;
  pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle, rgba(77, 226, 255, 0.09), transparent 66%);
}
.fx-progress {
  position: fixed; top: 0; right: 0; left: 0; height: 3px; z-index: 60;
  transform-origin: right center; transform: scaleX(0);
  background: linear-gradient(90deg, var(--lime), var(--cyan), var(--violet));
  box-shadow: 0 0 12px rgba(77, 226, 255, 0.5);
}
.fx-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.fx-confetti i {
  position: absolute; border-radius: 2px;
  animation: confetti-fly 1.15s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes confetti-fly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) rotate(420deg); opacity: 0; }
}

/* ------------------------------------------------------------ صفحهٔ بوت */
#hsk-boot {
  position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 22px; background: var(--bg);
  transition: opacity 0.5s, visibility 0.5s;
}
#hsk-boot.done { opacity: 0; visibility: hidden; }
.boot-core {
  position: relative; width: 108px; height: 78px; border-radius: 26px;
  background: linear-gradient(160deg, #2a4272, #0e1a33);
  border: 1px solid rgba(120, 170, 255, 0.3);
  animation: boot-float 2.4s ease-in-out infinite;
}
.boot-eye { position: absolute; top: 26px; width: 22px; height: 17px; border-radius: 9px; background: var(--cyan); box-shadow: 0 0 18px rgba(77, 226, 255, 0.75); animation: boot-blink 2.6s infinite; }
.boot-eye.l { right: 22px; }
.boot-eye.r { left: 22px; background: var(--violet); }
.boot-antenna { position: absolute; top: -22px; right: 50%; width: 3px; height: 20px; background: #8fa9d6; transform: translateX(50%); }
.boot-antenna::after { content: ''; position: absolute; top: -12px; right: -4px; width: 11px; height: 11px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 16px var(--lime); }
.boot-text { font-family: var(--font-display); font-size: 22px; color: var(--ink-2); margin: 0; }
@keyframes boot-float { 50% { transform: translateY(-10px); } }
@keyframes boot-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }

/* --------------------------------------------------------------- چیدمان */
#hsk-app { position: relative; z-index: 2; height: 100dvh; overflow-y: auto; overflow-x: hidden; }
#hsk-portal { position: relative; z-index: 70; }
.page { max-width: 1240px; margin: 0 auto; padding: 26px 22px 70px; }
.page.narrow { max-width: 900px; }
h1, h2, h3, h4, .display { font-family: var(--font-display); font-weight: 400; letter-spacing: 0; line-height: 1.45; margin: 0 0 12px; }
h1 { font-size: clamp(34px, 4.6vw, 56px); }
h2 { font-size: clamp(26px, 3vw, 38px); }
h3 { font-size: 23px; }
h4 { font-size: 19px; }
p { margin: 0 0 12px; }
a { color: var(--cyan); text-decoration: none; }
.small { font-size: 14px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.stack-lg { display: flex; flex-direction: column; gap: 34px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-head h2 { margin: 0; }
.kicker { font-family: var(--font-display); color: var(--cyan); font-size: 17px; display: flex; align-items: center; gap: 8px; }
.kicker::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(120, 170, 255, 0.22); border-radius: 20px; }
::-webkit-scrollbar-thumb:hover { background: rgba(120, 170, 255, 0.4); }

/* ---------------------------------------------------------------- کارت‌ها */
.panel {
  background: linear-gradient(150deg, rgba(139, 125, 255, 0.08), rgba(12, 22, 44, 0.72) 45%, rgba(12, 22, 44, 0.9));
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1), inset 0 1px rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(18px);
  padding: 22px;
}
.panel.tight { padding: 16px; }
.panel.flat { background: rgba(12, 22, 44, 0.6); }
.card {
  position: relative; overflow: hidden;
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.05), box-shadow 0.4s, border-color 0.4s;
  background: linear-gradient(150deg, rgba(139, 125, 255, 0.07), rgba(12, 22, 44, 0.78));
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px;
  box-shadow: var(--sh-1), inset 0 1px rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(16px);
}
.card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity 0.4s;
  background: radial-gradient(340px 200px at var(--mx, 50%) var(--my, 0%), rgba(77, 226, 255, 0.16), transparent 70%);
}
.card:hover::after { opacity: 1; }
.card:hover { border-color: var(--line-2); box-shadow: var(--sh-2), 0 0 0 1px rgba(77, 226, 255, 0.12); }
.card.link { cursor: pointer; }
.card-top { display: flex; align-items: flex-start; gap: 12px; }
.badge {
  font-family: var(--font-display); font-size: 14px; padding: 2px 11px; border-radius: 20px;
  border: 1px solid var(--line); color: var(--ink-2); background: rgba(120, 170, 255, 0.08); white-space: nowrap;
}
.badge.cyan { color: #061a22; background: linear-gradient(140deg, #e9fbff, var(--cyan)); border-color: transparent; }
.badge.lime { color: #08210a; background: linear-gradient(140deg, #f0ffe8, var(--lime)); border-color: transparent; }
.badge.violet { color: #120a33; background: linear-gradient(140deg, #efeaff, var(--violet)); border-color: transparent; }
.badge.amber { color: #241603; background: linear-gradient(140deg, #fff4dd, var(--amber)); border-color: transparent; }
.badge.pink { color: #2a0716; background: linear-gradient(140deg, #ffe9f2, var(--pink)); border-color: transparent; }
.badge.ghost { background: transparent; }
.icon-badge {
  font-family: var(--font-mono); font-weight: 700; font-size: 15px; letter-spacing: 0.5px;
  display: grid; place-items: center; flex-shrink: 0;
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.02));
  border: 1px solid var(--line-2); color: var(--ink);
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.28), 0 8px 18px -10px rgba(0, 0, 0, 0.9);
}
.icon-badge.sm { width: 40px; height: 40px; border-radius: 12px; font-size: 13px; }
.divider { height: 1px; background: var(--line); margin: 18px 0; }
.hr-soft { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 26px 0; }

/* --------------------------------------------------------------- دکمه‌ها */
.btn {
  font-family: var(--font-display); font-size: 17px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 13px 20px; border-radius: var(--r); border: 1px solid var(--line-2);
  background: rgba(120, 170, 255, 0.09); color: var(--ink); cursor: pointer;
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.25, 1.2), box-shadow 0.3s, background 0.3s, border-color 0.3s;
  will-change: transform;
}
.btn:hover { transform: translateY(-3px) scale(1.03); background: rgba(120, 170, 255, 0.16); box-shadow: 0 14px 26px -14px rgba(0, 0, 0, 0.9), 0 0 20px rgba(77, 226, 255, 0.16); }
.btn:active { transform: translateY(0) scale(0.99); }
.btn.primary {
  background: linear-gradient(140deg, #f0fbff, var(--cyan) 60%, #35b7d8);
  color: #04141c; border-color: rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.9), 0 12px 28px -12px rgba(77, 226, 255, 0.6);
}
.btn.primary:hover { box-shadow: inset 0 1px #fff, 0 18px 36px -14px rgba(77, 226, 255, 0.75); }
.btn.violet { background: linear-gradient(140deg, #f2eeff, var(--violet) 60%, #6a58e6); color: #12082c; border-color: rgba(255, 255, 255, 0.55); }
.btn.lime { background: linear-gradient(140deg, #f2ffe9, var(--lime) 62%, #74d553); color: #07200a; border-color: rgba(255, 255, 255, 0.5); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn.sm { padding: 9px 14px; font-size: 15px; border-radius: 12px; }
.btn.xl { padding: 17px 28px; font-size: 20px; border-radius: 18px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn-icon { width: 42px; height: 42px; padding: 0; border-radius: 13px; font-family: var(--font-body); font-size: 18px; }

/* ---------------------------------------------------- تراشهٔ حباب سه‌بعدی */
.chip {
  --mx: 50%; --my: 38%; --rx: 0deg; --ry: 0deg;
  position: relative; display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-size: 15px; color: var(--ink-2);
  padding: 8px 15px; border-radius: 20px; cursor: pointer; user-select: none;
  border: 1px solid var(--line);
  background:
    radial-gradient(120px 90px at var(--mx) var(--my), rgba(255, 255, 255, 0.22), transparent 70%),
    linear-gradient(150deg, rgba(139, 125, 255, 0.14), rgba(12, 22, 44, 0.7));
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.22), inset 0 -6px 14px -8px rgba(0, 0, 0, 0.9),
    0 6px 14px -8px rgba(0, 0, 0, 0.9);
  transform: perspective(680px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(0) scale(1);
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.25), box-shadow 0.4s, border-color 0.35s, color 0.3s;
}
.chip::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(70% 60% at var(--mx) var(--my), rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 72%);
  opacity: 0; transition: opacity 0.35s;
}
.chip::before {
  content: ''; position: absolute; inset: -6px; border-radius: 26px; pointer-events: none;
  background: radial-gradient(60% 70% at 50% 60%, rgba(77, 226, 255, 0.35), transparent 70%);
  opacity: 0; transition: opacity 0.4s; filter: blur(6px);
}
.chip:hover {
  color: var(--ink); border-color: rgba(140, 235, 255, 0.6);
  transform: perspective(680px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-5px) scale(1.08);
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.5), 0 22px 34px -16px rgba(0, 0, 0, 0.95),
    0 0 26px rgba(77, 226, 255, 0.28), 0 0 0 1px rgba(77, 226, 255, 0.28);
}
.chip:hover::after { opacity: 0.42; }
.chip:hover::before { opacity: 0.5; }
.chip.is-on { color: #04141c; border-color: transparent; background: linear-gradient(140deg, #eefbff, var(--cyan)); box-shadow: 0 10px 24px -12px rgba(77, 226, 255, 0.7), inset 0 1px rgba(255, 255, 255, 0.8); }
.chip.sm { font-size: 14px; padding: 6px 12px; }
.chip.bob { animation: chip-bob 5.2s ease-in-out infinite; }
@keyframes chip-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }

/* ------------------------------------------------------------------ فرم‌ها */
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-family: var(--font-display); font-size: 16px; color: var(--ink-2); }
.input, .select, .textarea {
  font-family: var(--font-body); font-size: 16px; color: var(--ink);
  background: rgba(6, 12, 28, 0.72); border: 1px solid var(--line);
  padding: 13px 15px; border-radius: var(--r); outline: none; width: 100%;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: rgba(77, 226, 255, 0.65); background: rgba(8, 18, 38, 0.85);
  box-shadow: 0 0 0 4px rgba(77, 226, 255, 0.1);
}
.input.ltr { direction: ltr; text-align: left; font-family: var(--font-mono); }
.input.err { border-color: rgba(255, 107, 107, 0.75); box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1); }
.hint { font-size: 13.5px; color: var(--muted); }
.hint.err { color: #ff9a9a; }
.hint.ok { color: var(--lime); }
.seg { display: inline-flex; gap: 6px; padding: 5px; border-radius: 18px; background: rgba(6, 12, 28, 0.6); border: 1px solid var(--line); }
.seg button {
  font-family: var(--font-display); font-size: 16px; padding: 8px 16px; border-radius: 13px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer; transition: all 0.3s;
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: linear-gradient(140deg, rgba(77, 226, 255, 0.9), rgba(53, 183, 216, 0.85)); color: #04141c; box-shadow: 0 6px 16px -8px rgba(77, 226, 255, 0.8); }

/* -------------------------------------------------------------- نوار بالا */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px;
  background: linear-gradient(180deg, rgba(6, 11, 26, 0.92), rgba(6, 11, 26, 0.7));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(20px);
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-name { font-family: var(--font-display); font-size: 27px; line-height: 1; }
.brand-name span { color: var(--cyan); }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.nav { display: flex; align-items: center; gap: 4px; margin-inline-start: 12px; flex-wrap: wrap; }
.nav-link {
  font-family: var(--font-display); font-size: 16px; color: var(--muted); padding: 8px 13px; border-radius: 12px;
  cursor: pointer; transition: all 0.3s; border: 1px solid transparent;
}
.nav-link:hover { color: var(--ink); background: rgba(120, 170, 255, 0.1); }
.nav-link.on { color: var(--ink); background: rgba(77, 226, 255, 0.14); border-color: rgba(77, 226, 255, 0.3); }
.topbar-right { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-display); font-size: 15px;
  padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: rgba(6, 12, 28, 0.6); color: var(--ink-2);
}
.pill.xp { color: var(--amber); border-color: rgba(255, 201, 77, 0.35); background: rgba(255, 201, 77, 0.09); }
.pill.streak { color: var(--pink); border-color: rgba(255, 123, 176, 0.35); background: rgba(255, 123, 176, 0.09); }
.pill.league { color: var(--lime); border-color: rgba(155, 255, 122, 0.3); background: rgba(155, 255, 122, 0.08); }
.avatar-btn {
  display: flex; align-items: center; gap: 9px; padding: 5px 12px 5px 8px; border-radius: 22px;
  border: 1px solid var(--line); background: rgba(6, 12, 28, 0.6); cursor: pointer; color: var(--ink);
  transition: all 0.3s; font-family: var(--font-display); font-size: 15px;
}
.avatar-btn:hover, .avatar-btn.open { border-color: var(--line-2); background: rgba(120, 170, 255, 0.12); }
.avatar-btn .hk-avatar { width: 34px; height: 34px; }
.caret { color: var(--muted); font-size: 11px; transition: transform 0.3s; }
.avatar-btn.open .caret { transform: rotate(180deg); }

/* --------------------------------------------------------- منوی پروفایل */
.menu {
  position: absolute; z-index: 65; min-width: 268px; padding: 12px;
  background: linear-gradient(160deg, rgba(18, 30, 58, 0.97), rgba(7, 13, 28, 0.98));
  border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--sh-2);
  backdrop-filter: blur(24px);
  animation: menu-in 0.28s cubic-bezier(0.2, 0.9, 0.25, 1.1);
}
@keyframes menu-in { from { opacity: 0; transform: translateY(-10px) scale(0.97); } }
.menu-head { display: flex; align-items: center; gap: 11px; padding: 6px 8px 12px; }
.menu-head .hk-avatar { width: 46px; height: 46px; }
.menu-head strong { font-family: var(--font-display); font-size: 18px; display: block; line-height: 1.4; }
.menu-head .small { color: var(--muted); }
.menu-item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: right;
  font-family: var(--font-display); font-size: 16px; color: var(--ink-2);
  padding: 10px 11px; border-radius: 13px; border: 0; background: transparent; cursor: pointer;
  transition: background 0.25s, color 0.25s, transform 0.25s;
}
.menu-item:hover { background: rgba(120, 170, 255, 0.14); color: var(--ink); transform: translateX(-3px); }
.menu-item .mi { width: 22px; text-align: center; opacity: 0.85; }
.menu-item.danger { color: #ff9a9a; }
.menu-item.danger:hover { background: rgba(255, 107, 107, 0.14); }
.menu-sep { height: 1px; background: var(--line); margin: 8px 4px; }
.menu-foot { padding: 8px 10px 2px; display: flex; align-items: center; justify-content: space-between; }

/* ------------------------------------------------------------ ربات و گفتار */
.hk-robot { --hk-size: 220px; display: inline-block; width: var(--hk-size); height: auto; line-height: 0; }
.hk-robot svg { width: 100%; height: auto; overflow: visible; }
.hk-robot .hk-halo { animation: halo-pulse 5.5s ease-in-out infinite; }
.hk-robot .hk-ring { transform-origin: 110px 120px; animation: spin 34s linear infinite; }
.hk-robot { animation: hk-float 5.4s ease-in-out infinite; }
.hk-robot .hk-orb { animation: orb-pulse 2.6s ease-in-out infinite; }
.hk-robot .hk-led { animation: orb-pulse 1.8s ease-in-out infinite; }
.hk-robot .hk-core { stroke-dasharray: 4 5; animation: core-run 2.2s linear infinite; }
.hk-robot .hk-eye-l, .hk-robot .hk-eye-r { transform-origin: center; animation: hk-blink 6.4s infinite; }
.hk-robot .hk-eyes-happy, .hk-robot .hk-eyes-think, .hk-robot .hk-mouth-o,
.hk-robot .hk-mouth-flat, .hk-robot .hk-sparks { opacity: 0; }
.hk-robot .hk-sparks { animation: none; }
.hk-robot.mood-happy .hk-eyes-open { opacity: 0; }
.hk-robot.mood-happy .hk-eyes-happy { opacity: 1; }
.hk-robot.mood-happy .hk-sparks { opacity: 1; animation: spark-pop 1.1s ease-out; }
.hk-robot.mood-think .hk-eyes-open { opacity: 0; }
.hk-robot.mood-think .hk-eyes-think { opacity: 1; }
.hk-robot.mood-think .hk-mouth-smile { opacity: 0; }
.hk-robot.mood-think .hk-mouth-flat { opacity: 1; }
.hk-robot.mood-think .hk-dots { animation: think-dots 1.2s infinite; }
.hk-robot.mood-proud .hk-mouth-smile { opacity: 0; }
.hk-robot.mood-proud .hk-mouth-o { opacity: 1; }
.hk-robot.mood-proud .hk-sparks { opacity: 1; }
.hk-robot.mood-sad .hk-mouth-smile { opacity: 0; }
.hk-robot.mood-sad .hk-mouth-flat { opacity: 1; }
.hk-robot.mood-sad .hk-eye-l, .hk-robot.mood-sad .hk-eye-r { fill: #8fa9d6; }
.hk-robot.mood-fly .hk-cap { transform: rotate(-24deg) translateY(-6px); }
.hk-robot .hk-cap { transition: transform 0.6s ease; }
@keyframes hk-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-11px) rotate(-0.6deg); } }
@keyframes halo-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes orb-pulse { 0%, 100% { opacity: 0.55; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.12); } }
@keyframes hk-blink { 0%, 91%, 97%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
@keyframes think-dots { 0%, 100% { r: 3; opacity: 0.5; } 50% { r: 5; opacity: 1; } }
@keyframes spark-pop { 0% { opacity: 0; transform: scale(0.4); } 40% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
.hk-say {
  position: relative; background: linear-gradient(150deg, rgba(139, 125, 255, 0.16), rgba(9, 17, 35, 0.92));
  border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 15px 18px; min-height: 62px;
  box-shadow: var(--sh-1), inset 0 1px rgba(255, 255, 255, 0.09);
}
.hk-say-text { font-family: var(--font-display); font-size: 18px; line-height: 1.85; margin: 0; color: var(--ink); }
.hk-say-tail {
  position: absolute; bottom: -9px; right: 46px; width: 18px; height: 18px; transform: rotate(45deg);
  background: linear-gradient(150deg, rgba(9, 17, 35, 0.95), rgba(9, 17, 35, 0.95));
  border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
}
.hk-say.left .hk-say-tail { right: auto; left: 46px; }
.hk-avatar { width: 40px; height: 40px; display: block; }
.hk-head { display: block; }

/* --------------------------------------------------------------- تراشه‌ها */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); flex-shrink: 0; }
.dot.lime { background: var(--lime); box-shadow: 0 0 10px var(--lime); }
.dot.amber { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.dot.pink { background: var(--pink); box-shadow: 0 0 10px var(--pink); }

/* ------------------------------------------------------------- نوار پیشرفت */
.bar { height: 9px; border-radius: 20px; background: rgba(6, 12, 28, 0.8); border: 1px solid var(--line); overflow: hidden; }
.bar > i {
  display: block; height: 100%; width: 0; border-radius: 20px;
  background: linear-gradient(90deg, var(--violet), var(--cyan));
  transition: width 0.7s cubic-bezier(0.2, 0.9, 0.25, 1);
  box-shadow: 0 0 14px rgba(77, 226, 255, 0.5);
}
.bar.lime > i { background: linear-gradient(90deg, #5ed35a, var(--lime)); box-shadow: 0 0 14px rgba(155, 255, 122, 0.5); }
.bar.slim { height: 6px; }
.ring { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-bg { fill: none; stroke: rgba(120, 170, 255, 0.16); stroke-width: 9; }
.ring .ring-fg { fill: none; stroke: url(#hkRing); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.2, 0.9, 0.25, 1); }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .ring-label strong { font-family: var(--font-display); font-size: 26px; display: block; line-height: 1.2; }
.ring .ring-label span { font-size: 12px; color: var(--muted); }

/* ----------------------------------------------------------- ظهور و حالت */
.rv { opacity: 0; transform: translateY(22px); transition: opacity 0.7s cubic-bezier(0.2, 0.9, 0.25, 1), transform 0.7s cubic-bezier(0.2, 0.9, 0.25, 1); }
.rv.is-in { opacity: 1; transform: none; }
.still *, .still *::before, .still *::after { animation: none !important; transition-duration: 0.01ms !important; }
.still .rv { opacity: 1 !important; transform: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

/* ------------------------------------------------------------ توست و مودال */
.toasts { position: fixed; bottom: 20px; right: 20px; z-index: 95; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex; align-items: center; gap: 12px; min-width: 260px; max-width: 380px;
  padding: 13px 16px; border-radius: var(--r); border: 1px solid var(--line-2);
  background: linear-gradient(150deg, rgba(20, 33, 62, 0.97), rgba(7, 13, 28, 0.97));
  box-shadow: var(--sh-2); animation: toast-in 0.42s cubic-bezier(0.2, 0.9, 0.25, 1.2);
}
.toast.out { animation: toast-out 0.4s forwards; }
.toast .t-icon { font-size: 22px; }
.toast strong { font-family: var(--font-display); font-size: 17px; display: block; line-height: 1.4; }
.toast .small { color: var(--muted); }
.toast.xp { border-color: rgba(255, 201, 77, 0.5); }
.toast.win { border-color: rgba(155, 255, 122, 0.5); }
.toast.bad { border-color: rgba(255, 107, 107, 0.5); }
@keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(0.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateX(-30px) scale(0.96); } }
.xp-float {
  position: fixed; z-index: 96; font-family: var(--font-display); font-size: 26px; color: var(--lime);
  text-shadow: 0 0 20px rgba(155, 255, 122, 0.7); pointer-events: none;
  animation: xp-up 1.35s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}
@keyframes xp-up { 0% { opacity: 0; transform: translateY(6px) scale(0.8); } 25% { opacity: 1; transform: translateY(-10px) scale(1.1); } 100% { opacity: 0; transform: translateY(-64px) scale(1); } }
.scrim { position: fixed; inset: 0; z-index: 68; background: rgba(3, 6, 16, 0.66); backdrop-filter: blur(6px); animation: fade-in 0.3s; }
@keyframes fade-in { from { opacity: 0; } }
.modal {
  position: fixed; z-index: 69; top: 50%; right: 50%; transform: translate(50%, -50%);
  width: min(94vw, 560px); max-height: 88vh; overflow: auto;
  background: linear-gradient(160deg, rgba(20, 33, 62, 0.98), rgba(7, 13, 28, 0.99));
  border: 1px solid var(--line-2); border-radius: var(--r-xl); box-shadow: var(--sh-2); padding: 24px;
  animation: modal-in 0.36s cubic-bezier(0.2, 0.9, 0.25, 1.1);
}
@keyframes modal-in { from { opacity: 0; transform: translate(50%, -46%) scale(0.94); } }

/* -------------------------------------------------------------- راهنماها */
.callout {
  display: flex; gap: 13px; align-items: flex-start; padding: 15px 17px; border-radius: var(--r);
  background: rgba(77, 226, 255, 0.07); border: 1px solid rgba(77, 226, 255, 0.24); color: var(--ink-2);
}
.callout.lime { background: rgba(155, 255, 122, 0.07); border-color: rgba(155, 255, 122, 0.24); }
.callout.amber { background: rgba(255, 201, 77, 0.08); border-color: rgba(255, 201, 77, 0.26); }
.callout.violet { background: rgba(139, 125, 255, 0.09); border-color: rgba(139, 125, 255, 0.26); }
.callout p { margin: 0; font-size: 15.5px; }
.callout strong { font-family: var(--font-display); font-weight: 400; }

/* ---------------------------------------------------------------- کروم LTR */
.code {
  direction: ltr; text-align: left; font-family: var(--font-mono); font-size: 14px; line-height: 1.75;
  background: rgba(4, 9, 22, 0.9); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px;
  overflow-x: auto; white-space: pre; color: #cfe6ff; margin: 0;
}
.code .cm { color: #7d94b8; }
.mono { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; }

@media (max-width: 900px) {
  .nav { display: none; }
  .topbar { padding: 10px 14px; gap: 10px; }
  .brand-name { font-size: 22px; }
  .page { padding: 18px 14px 90px; }
  .toasts { right: 12px; left: 12px; bottom: 12px; }
  .pill span:not(.dot) { display: none; }
}

/* ===== site.css ===== */
/* =====================================================================
   هوشیکا · نمای صفحه‌ها
   ===================================================================== */

/* ------------------------------------------------------- دروازهٔ ورود/ثبت‌نام */
.auth { min-height: 100dvh; display: grid; grid-template-columns: 1.05fr 0.95fr; }

    radial-gradient(ellipse 70% 50% at 20% 12%, rgba(77, 226, 255, 0.16), transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 90%, rgba(139, 125, 255, 0.18), transparent 62%);
  border-inline-start: 1px solid var(--line);
  overflow: hidden;
}
.auth-visual .hk-robot { --hk-size: 300px; margin: 4px auto 0; }
.auth-visual .hk-say { max-width: 520px; margin-inline: auto; }
.auth-title { font-size: clamp(38px, 5vw, 62px); margin: 0; }

.auth-points { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.auth-card {
  display: flex; flex-direction: column; justify-content: center;
  padding: 40px clamp(22px, 4vw, 60px);
}
.auth-box { width: 100%; max-width: 470px; margin-inline: auto; }
.tabs { display: flex; gap: 6px; padding: 5px; border-radius: 18px; background: rgba(6, 12, 28, 0.7); border: 1px solid var(--line); margin-bottom: 22px; }
.tabs button {
  flex: 1; font-family: var(--font-display); font-size: 18px; padding: 11px; border-radius: 14px;
  border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.35s;
}
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: #04141c; background: linear-gradient(140deg, #eafcff, var(--cyan)); box-shadow: 0 10px 24px -14px rgba(77, 226, 255, 0.9); }
.otp-row { display: flex; gap: 9px; direction: ltr; justify-content: center; margin: 6px 0 4px; }
.otp-row input {
  width: 52px; height: 60px; text-align: center; font-family: var(--font-display); font-size: 26px;
  color: var(--ink); background: rgba(6, 12, 28, 0.8); border: 1px solid var(--line); border-radius: 14px; outline: none;
  transition: all 0.3s;
}
.otp-row input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(77, 226, 255, 0.12); transform: translateY(-3px); }
.demo-sms {
  display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: var(--r); margin-top: 14px;
  background: linear-gradient(140deg, rgba(155, 255, 122, 0.12), rgba(12, 22, 44, 0.7));
  border: 1px dashed rgba(155, 255, 122, 0.4);
}
.demo-sms code { font-family: var(--font-mono); font-size: 20px; color: var(--lime); letter-spacing: 3px; }
.auth-switch { text-align: center; color: var(--muted); font-size: 15px; margin-top: 18px; }
.auth-switch b { font-family: var(--font-display); font-weight: 400; color: var(--cyan); cursor: pointer; }
.step-dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 14px; }
.step-dots i { width: 26px; height: 4px; border-radius: 4px; background: rgba(120, 170, 255, 0.22); }
.step-dots i.on { background: linear-gradient(90deg, var(--cyan), var(--lime)); box-shadow: 0 0 10px rgba(77, 226, 255, 0.6); }

/* --------------------------------------------------------------- آنبوردینگ */
.wizard { max-width: 900px; margin: 0 auto; }
.wizard-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 15px; margin-bottom: 12px; }
.question-title { font-family: var(--font-display); font-size: clamp(24px, 3vw, 34px); margin: 4px 0 10px; }
.question-description { color: var(--muted); font-size: 16.5px; margin-bottom: 18px; }
.answer-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.answer-option {
  position: relative; text-align: right; font-family: var(--font-display); font-size: 17px; line-height: 1.6;
  color: var(--ink-2); background: linear-gradient(150deg, rgba(139, 125, 255, 0.08), rgba(12, 22, 44, 0.7));
  border: 1px solid var(--line); border-radius: var(--r); padding: 15px 17px; cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.2), border-color 0.3s, background 0.3s, box-shadow 0.35s;
}
.answer-option:hover { transform: translateY(-4px) scale(1.015); border-color: var(--line-2); background: rgba(120, 170, 255, 0.12); box-shadow: 0 16px 30px -18px rgba(0, 0, 0, 0.95); }
.answer-option[data-state="on"] { border-color: rgba(77, 226, 255, 0.7); background: linear-gradient(150deg, rgba(77, 226, 255, 0.22), rgba(12, 22, 44, 0.7)); box-shadow: 0 0 0 1px rgba(77, 226, 255, 0.4), 0 0 26px rgba(77, 226, 255, 0.18); color: var(--ink); }
.answer-option[data-state="right"] { border-color: rgba(155, 255, 122, 0.8); background: linear-gradient(150deg, rgba(155, 255, 122, 0.22), rgba(12, 22, 44, 0.7)); }
.answer-option[data-state="wrong"] { border-color: rgba(255, 107, 107, 0.8); background: linear-gradient(150deg, rgba(255, 107, 107, 0.18), rgba(12, 22, 44, 0.7)); animation: shake 0.45s; }
@keyframes shake { 25% { transform: translateX(7px); } 75% { transform: translateX(-7px); } }
.answer-option .ao-num {
  position: absolute; top: 10px; left: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px; padding: 0 6px;
}
.wizard-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.goal-tile { display: flex; flex-direction: column; gap: 6px; padding: 18px; }
.goal-tile .gt-icon { font-size: 30px; }
.goal-tile strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.goal-tile p { margin: 0; font-size: 14.5px; color: var(--muted); line-height: 1.8; }
.quiz-card .hk-say { margin-bottom: 16px; }

/* ------------------------------------------------------------- داشبورد */
.dash-hero { display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 20px; align-items: stretch; }
.dash-hero .who { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.dash-hero .hk-robot { --hk-size: 230px; margin: 0 auto; }
.who-line { font-size: 17.5px; color: var(--ink-2); }
.who-line b { font-family: var(--font-display); font-weight: 400; color: var(--cyan); }
.stat-card { display: flex; align-items: center; gap: 14px; }
.stat-card .s-icon { font-size: 24px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; background: rgba(120, 170, 255, 0.1); border: 1px solid var(--line); }
.stat-card strong { font-family: var(--font-display); font-weight: 400; font-size: 26px; display: block; line-height: 1.3; }
.stat-card span { font-size: 14px; color: var(--muted); }
.mission { display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(6, 12, 28, 0.55); }

.mission.done { border-color: rgba(155, 255, 122, 0.4); background: linear-gradient(140deg, rgba(155, 255, 122, 0.12), rgba(6, 12, 28, 0.6)); }
.mission .m-body { flex: 1; min-width: 0; }
.mission strong { font-family: var(--font-display); font-weight: 400; font-size: 17px; display: block; }
.mission .small { color: var(--muted); }
.streak-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.streak-day {

  font-family: var(--font-display); font-size: 15px; color: var(--muted);
}
.streak-day.on { border-color: rgba(255, 123, 176, 0.55); background: linear-gradient(150deg, rgba(255, 123, 176, 0.22), rgba(6, 12, 28, 0.6)); color: var(--ink); box-shadow: 0 0 18px -6px rgba(255, 123, 176, 0.7); }
.streak-day.today { border-color: var(--cyan); }

.continue-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.continue-card .grow { min-width: 220px; }
.mini-league { display: flex; flex-direction: column; gap: 8px; }
.mini-row { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 13px; background: rgba(6, 12, 28, 0.5); border: 1px solid transparent; }
.mini-row.me { border-color: rgba(77, 226, 255, 0.5); background: linear-gradient(140deg, rgba(77, 226, 255, 0.14), rgba(6, 12, 28, 0.6)); }
.mini-row .rank { font-family: var(--font-display); font-size: 17px; color: var(--muted); width: 26px; text-align: center; }

.mini-row .name { font-family: var(--font-display); font-size: 16px; flex: 1; }

.ach-tile .a-icon { font-size: 27px; display: block; }
.ach-tile strong { font-family: var(--font-display); font-weight: 400; font-size: 15px; display: block; margin-top: 4px; }
.ach-tile small { color: var(--muted); font-size: 12.5px; line-height: 1.6; display: block; }
.ach-tile.locked { opacity: 0.42; filter: grayscale(0.7); }
.ach-tile.get { border-color: rgba(255, 201, 77, 0.5); background: linear-gradient(150deg, rgba(255, 201, 77, 0.14), rgba(6, 12, 28, 0.6)); }

/* ------------------------------------------------------------- فهرست دوره‌ها */
.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.cat-chips { display: flex; gap: 9px; flex-wrap: wrap; }
.course-card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
.course-card .cc-top { display: flex; align-items: flex-start; gap: 13px; }
.course-card h3 { margin: 0; font-size: 21px; }
.course-card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.85; }
.cc-meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
.cc-meta span { display: inline-flex; align-items: center; gap: 5px; }
.course-card .cc-foot { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.cover {

  background: linear-gradient(140deg, rgba(255, 255, 255, 0.06), rgba(6, 12, 28, 0.8));

}

.cover .cc-code { font-family: var(--font-mono); font-size: 34px; font-weight: 700; opacity: 0.9; letter-spacing: 1px; }
.cover .cc-sig { font-family: var(--font-mono); font-size: 12px; color: var(--muted); direction: ltr; }
.progress-line { display: flex; align-items: center; gap: 10px; }
.progress-line .bar { flex: 1; }
.progress-line span { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* --------------------------------------------------------------- صفحهٔ درس */
.course-hero { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 18px; align-items: center; }
.course-hero .hk-robot { --hk-size: 190px; margin-inline: auto; }
.tabs-line { display: flex; gap: 8px; flex-wrap: wrap; }
.module { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: rgba(8, 15, 32, 0.5); }
.module + .module { margin-top: 14px; }
.module-head {
  display: flex; align-items: center; gap: 13px; padding: 15px 18px; cursor: pointer;
  background: linear-gradient(140deg, rgba(139, 125, 255, 0.09), rgba(8, 15, 32, 0.4));
  transition: background 0.3s;
}
.module-head:hover { background: rgba(120, 170, 255, 0.12); }
.module-head .m-index { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.module-head strong { font-family: var(--font-display); font-weight: 400; font-size: 19px; flex: 1; }
.module-head .caret { transition: transform 0.35s; }
.module.open .module-head .caret { transform: rotate(180deg); }
.module-body { display: none; padding: 10px 14px 16px; }
.module.open .module-body { display: block; animation: menu-in 0.3s; }
.lesson-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 13px; border-radius: var(--r); cursor: pointer;
  border: 1px solid transparent; transition: all 0.3s;
}
.lesson-row:hover { background: rgba(120, 170, 255, 0.1); border-color: var(--line); }
.lesson-row + .lesson-row { margin-top: 6px; }
.lesson-row .l-state {
  width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
  border: 1px solid var(--line); font-size: 14px; color: var(--muted); background: rgba(6, 12, 28, 0.7);
}
.lesson-row.done .l-state { border-color: rgba(155, 255, 122, 0.6); color: var(--lime); background: rgba(155, 255, 122, 0.12); }
.lesson-row.current .l-state { border-color: rgba(77, 226, 255, 0.7); color: var(--cyan); box-shadow: 0 0 16px -4px rgba(77, 226, 255, 0.7); }
.lesson-row.locked { opacity: 0.55; }
.lesson-row .l-title { font-family: var(--font-display); font-size: 17px; flex: 1; min-width: 0; }
.lesson-row.locked .l-title { color: var(--muted); }
.lesson-row .l-xp { font-family: var(--font-display); font-size: 14px; color: var(--amber); }
.lesson-layout { display: grid; grid-template-columns: 1.55fr 0.95fr; gap: 20px; align-items: start; }
.lesson-side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; }
.goals { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
.goals li { display: flex; gap: 9px; align-items: flex-start; font-size: 15.5px; color: var(--ink-2); }
.goals li::before { content: '✓'; color: var(--lime); font-family: var(--font-display); }
.step-list { list-style: none; counter-reset: st; padding: 0; margin: 0; }
.step-list li { counter-increment: st; position: relative; padding-inline-start: 42px; margin-bottom: 14px; color: var(--ink-2); }
.step-list li::before {
  content: counter(st); position: absolute; right: 0; top: 2px; width: 28px; height: 28px; border-radius: 10px;
  display: grid; place-items: center; font-family: var(--font-display); font-size: 15px; color: #04141c;
  background: linear-gradient(140deg, #eafcff, var(--cyan)); box-shadow: 0 6px 16px -8px rgba(77, 226, 255, 0.9);
}
.code-wrap { position: relative; margin: 14px 0; }
.code-wrap .copy { position: absolute; top: 10px; left: 10px; }
.playground { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 14px 0; background: rgba(4, 9, 22, 0.7); }
.playground .pg-head { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-bottom: 1px solid var(--line); background: rgba(120, 170, 255, 0.06); }
.playground textarea {
  width: 100%; min-height: 150px; border: 0; outline: none; resize: vertical; padding: 13px;
  background: rgba(4, 9, 22, 0.9); color: #cfe6ff; font-family: var(--font-mono); font-size: 14px; line-height: 1.8;
  direction: ltr; text-align: left;
}
.playground iframe { width: 100%; height: 210px; border: 0; border-top: 1px solid var(--line); background: #04101f; }
.result {
  display: grid; place-items: center; text-align: center; min-height: 150px; padding: 16px;
  background: radial-gradient(ellipse at 50% 0%, rgba(77, 226, 255, 0.12), transparent 70%), rgba(4, 9, 22, 0.8);
  border: 1px solid var(--line); border-radius: var(--r); margin: 14px 0;
}
.result h2 { font-family: var(--font-display); font-size: 28px; margin: 0 0 6px; }
.result-caption { color: var(--muted); font-size: 14px; }
.quiz-block { margin-top: 18px; }
.quiz-q { padding: 15px 17px; border: 1px solid var(--line); border-radius: var(--r); background: rgba(6, 12, 28, 0.55); }
.quiz-q + .quiz-q { margin-top: 12px; }
.quiz-q .q-title { font-family: var(--font-display); font-size: 17px; margin-bottom: 10px; }
.explain { margin-top: 10px; font-size: 15px; color: var(--ink-2); }
.explain.right { color: var(--lime); }
.explain.wrong { color: #ff9a9a; }
.lesson-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ مسیر من */
.road-step {
  display: flex; gap: 16px; padding: 17px 19px; border: 1px solid var(--line); border-radius: var(--r-lg);
  background: linear-gradient(140deg, rgba(139, 125, 255, 0.07), rgba(8, 15, 32, 0.5)); align-items: flex-start;
}
.road-step + .road-step { margin-top: 12px; }
.road-step.completed { border-color: rgba(155, 255, 122, 0.42); background: linear-gradient(140deg, rgba(155, 255, 122, 0.1), rgba(8, 15, 32, 0.5)); }
.step-marker {
  width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 15px; color: var(--cyan);
  background: rgba(77, 226, 255, 0.1); border: 1px solid rgba(77, 226, 255, 0.35);
}
.step-body h3 { margin: 2px 0 6px; font-size: 21px; }
.step-body p { margin: 0; color: var(--muted); font-size: 15.5px; }
.step-task { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; color: var(--ink-2); font-size: 15.5px; }
.step-task::before { content: '»'; color: var(--lime); font-family: var(--font-display); }

/* -------------------------------------------------------------------- لیگ */
.league-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.countdown { display: flex; gap: 9px; }
.cd-cell { min-width: 66px; padding: 11px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(6, 12, 28, 0.6); text-align: center; }
.cd-cell strong { font-family: var(--font-display); font-weight: 400; font-size: 24px; display: block; color: var(--cyan); }
.cd-cell span { font-size: 12.5px; color: var(--muted); }
.league-table { display: flex; flex-direction: column; gap: 7px; }
.league-row {
  display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 15px;
  background: rgba(6, 12, 28, 0.55); border: 1px solid transparent; position: relative;
  transition: transform 0.3s, background 0.3s;
}
.league-row:hover { transform: translateX(-3px); background: rgba(120, 170, 255, 0.1); }
.league-row.me { border-color: rgba(77, 226, 255, 0.55); background: linear-gradient(140deg, rgba(77, 226, 255, 0.16), rgba(6, 12, 28, 0.6)); box-shadow: 0 0 26px -10px rgba(77, 226, 255, 0.8); }
.league-row.promo { border-inline-start: 3px solid var(--lime); }
.league-row.drop { border-inline-start: 3px solid var(--danger); }
.league-row .rank { width: 34px; text-align: center; font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.league-row .rank.top { color: var(--amber); }
.league-row .name { font-family: var(--font-display); font-size: 16.5px; flex: 1; min-width: 0; }
.league-row .xp { font-family: var(--font-display); font-size: 15.5px; color: var(--amber); }
.league-row .delta { font-size: 13px; color: var(--lime); }
.league-row .delta.down { color: var(--danger); }
.zone-note { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.zone-note i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 6px; }
.tier-badge { display: flex; align-items: center; gap: 12px; padding: 14px 17px; border-radius: var(--r-lg); border: 1px solid var(--line); background: rgba(6, 12, 28, 0.6); }
.tier-badge .t-icon { font-size: 30px; }
.tier-badge strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: block; }

/* ---------------------------------------------------------------- پروفایل */
.profile-head { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.profile-head .hk-robot { --hk-size: 150px; }
.avatar-picker { display: flex; gap: 10px; flex-wrap: wrap; }
.avatar-opt {
  padding: 8px; border-radius: 16px; border: 1px solid var(--line); background: rgba(6, 12, 28, 0.6); cursor: pointer;
  transition: all 0.3s;
}
.avatar-opt:hover { transform: translateY(-3px) scale(1.05); }
.avatar-opt.on { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(77, 226, 255, 0.5), 0 0 22px -8px rgba(77, 226, 255, 0.9); }
.setting-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .grow strong { font-family: var(--font-display); font-weight: 400; font-size: 17px; display: block; }
.setting-row .grow span { color: var(--muted); font-size: 14px; }
.switch { width: 54px; height: 30px; border-radius: 20px; border: 1px solid var(--line); background: rgba(6, 12, 28, 0.8); cursor: pointer; position: relative; transition: background 0.3s; flex-shrink: 0; }
.switch i { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.25, 1.3), background 0.3s; }
.switch.on { background: linear-gradient(140deg, rgba(155, 255, 122, 0.35), rgba(77, 226, 255, 0.3)); border-color: rgba(155, 255, 122, 0.5); }
.switch.on i { transform: translateX(-24px); background: var(--lime); box-shadow: 0 0 14px rgba(155, 255, 122, 0.9); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }

/* ------------------------------------------------------------------ فوتر */
.foot {
  max-width: 1240px; margin: 40px auto 0; padding: 24px 22px 34px; border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 14.5px;
}
.foot .foot-brand { display: flex; align-items: center; gap: 10px; }
.foot a { color: var(--ink-2); }
.foot a:hover { color: var(--cyan); }
.hero-landing { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 26px; align-items: center; padding: 34px 0 10px; }
.hero-landing h1 { margin-bottom: 10px; }
.hero-landing h1 b { color: var(--cyan); font-weight: 400; }
.hero-landing .hk-robot { --hk-size: 280px; margin-inline: auto; }
.landing-list { list-style: none; padding: 0; margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.landing-list li { display: flex; gap: 10px; color: var(--ink-2); }
.landing-list li::before { content: '◈'; color: var(--cyan); }
.landing-stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 18px 0; }
.landing-stats div strong { font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--cyan); display: block; line-height: 1.2; }
.landing-stats div span { color: var(--muted); font-size: 14px; }

/* -------------------------------------------------------------- واکنش‌گرا */
@media (max-width: 1080px) {
  .dash-hero, .course-hero, .hero-landing { grid-template-columns: 1fr; }
  .lesson-layout { grid-template-columns: 1fr; }
  .lesson-side { position: static; }
}
@media (max-width: 900px) {
  .auth { grid-template-columns: 1fr; }
  .auth-visual { display: none; }
  .auth-card { padding: 26px 18px 40px; }
  .otp-row input { width: 46px; height: 54px; }
  .hk-robot { --hk-size: 190px; }
  .foot { flex-direction: column; align-items: flex-start; gap: 10px; }
  .mission { flex-wrap: wrap; }
  .league-row .delta { display: none; }
}

<script>

(function () {

  var FA_D = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
  function fa(n) {

  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function weekKey(d) {
    d = d || new Date();
    var c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    c.setDate(c.getDate() - ((c.getDay() + 1) % 7)); // شنبهٔ همین هفته
    return dayKey(c);
  }
  function monthKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function persianDate(d) {
    try {
      return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long' }).format(d || new Date());

      return dayKey(d || new Date());

  function weekEnd(d) {
    d = d || new Date();
    var e = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var left = (5 - e.getDay() + 7) % 7; // 5 = جمعه
    e.setDate(e.getDate() + left);
    e.setHours(23, 59, 59, 0);
    if (e.getTime() <= (d || new Date()).getTime()) e.setDate(e.getDate() + 7);

  }

    var ms = target.getTime() - Date.now();
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);

    return { days: days, h: Math.floor(s / 3600), m: Math.floor((s % 3600) / 60) };

  function modulesOf(course) {
    var mods = [];
    for (var i = 0; i < course.topics.length; i += 4) {
      mods.push({ index: mods.length, title: 'ماژول ' + fa(mods.length + 1), topics: course.topics.slice(i, i + 4), offset: i });
    }
    return mods;
  }
  function lessonList(course) {
    return course.topics.map(function (t, i) {
      return { course: course.id, index: i, title: t, module: Math.floor(i / 4), xp: 10 };
    });
  }

  function lessonBody(course, topic, i) {

    return {
      intro: pick(INTRO_T, seed).split('{t}').join(topic).split('{c}').join(course.title),
      why: pick(WHY_T, seed + 11).split('{t}').join(topic).split('{c}').join(course.title),
      steps: [STEPS_T[0], pick([STEPS_T[1], STEPS_T[2], STEPS_T[3]], seed + 31)],
      task: pick(TASK_T, seed + 53).split('{t}').join(topic),
      goals: [

        'اجرای یک نمونهٔ کوتاه از ' + topic + ' در ' + course.title,

  /* سؤال‌های عمومی برای درس‌هایی که بانک اختصاصی ندارند */
  QB.lang = QB.lang;
  function quizFor(course, topic, seed) {
    var bank = QB[course.cat] || QB.lang;
    var list = shuffle(bank, hash(course.id + topic) + (seed || 0));
    return list.slice(0, 2).map(function (q) {
      var idx = shuffle(q.opts.map(function (_, i) { return i; }), hash(q.text));
      return {
        text: q.text, why: q.why,
        opts: idx.map(function (i) { return q.opts[i]; }),
        ans: idx.indexOf(q.ans)
      };
    });
  }
  /* تست سطح‌بندی تطبیقی: از آسان به سخت بر اساس پاسخ‌ها */
  function placementQuestions(catId, startTier) {
    var bank = QB[catId] || QB.lang;
    var byTier = { 1: [], 2: [], 3: [] };
    bank.forEach(function (q) { byTier[q.tier].push(q); });
    var out = [], ti = Math.max(1, Math.min(3, startTier || 2)), used = [];
    for (var i = 0; i < 5; i++) {
      var pool = byTier[ti].filter(function (q) { return used.indexOf(q) < 0; });
      if (!pool.length) { pool = bank.filter(function (q) { return used.indexOf(q) < 0; }); }
      if (!pool.length) break;
      var q = pool[Math.floor(rnd(hash(catId + i + ti) + i) * pool.length) % pool.length];
      used.push(q); out.push({ q: q, tier: ti });
      /* سطح بعدی بر اساس عملکرد تعیین می‌شود (اینجا فقط پیشنهاد اولیه است) */
      ti = ti + (i % 2 === 0 ? 1 : 0);
      if (ti > 3) ti = 3;
    }
    return out;
  }
  var PLACEMENT_LEVELS = [

    { max: 5, level: 5, title: 'حرفه‌ای', note: 'واقعاً خوبی! مسیرت پروژه‌محور و چالشی است.' }
  ];
  function levelFromScore(correct, total) {
    var pct = total ? correct / total : 0;
    if (pct <= 0.2) return PLACEMENT_LEVELS[0];
    if (pct <= 0.4) return PLACEMENT_LEVELS[1];
    if (pct <= 0.6) return PLACEMENT_LEVELS[2];
    if (pct <= 0.8) return PLACEMENT_LEVELS[3];
    return PLACEMENT_LEVELS[4];
  }

  /* رقیب‌های شبیه‌سازی‌شدهٔ پایدار (چون بازی چندنفره واقعی به سرور نیاز دارد) */
  function rivals(periodKey, tier) {
    var out = [], count = 14;
    var tierBoost = { bronze: 1, silver: 1.6, gold: 2.4, diamond: 3.4, legend: 4.6 }[tier.id] || 1;
    for (var i = 0; i < count; i++) {
      var s = hash(periodKey + tier.id + ':' + i);
      var name = NAMES[Math.floor(rnd(s) * NAMES.length) % NAMES.length];
      var base = Math.round((180 + rnd(s + 7) * 900) * tierBoost);
      var frac = progressOfPeriod(periodKey);
      out.push({
        id: 'rival-' + i,
        name: name,
        avatar: AVATARS[i % AVATARS.length],
        xp: Math.round(base * (0.25 + 0.75 * frac)),
        rival: true
      });
    }
    return out;
  }
  /* چه کسری از دورهٔ جاری گذشته است؟ */
  function progressOfPeriod(key) {
    var now = new Date(), start, end;
    if (key.length === 10) { // هفتگی
      end = weekEnd(now); start = new Date(end); start.setDate(start.getDate() - 7);
    } else {
      end = monthEnd(now); start = new Date(end.getFullYear(), end.getMonth(), 1);
    }
    var total = end - start, done = now - start;
    return Math.max(0.05, Math.min(1, done / total));
  }

    opt = opt || {};
    return '' +
      '<div class="hk-say ' + (opt.cls || '') + '" data-typing="' + (opt.type === false ? '0' : '1') + '">' +
      '<div class="hk-say-body"><p class="hk-say-text">' + text + '</p></div>' +
      '<span class="hk-say-tail"></span>' +
      '</div>';
  }

  /* تایپ تدریجی متن؛ اگر کاربر انیمیشن نخواهد، مستقیم نوشته می‌شود */
  function type(el, text, speed) {
    if (!el) return;
    var node = el.querySelector('.hk-say-text') || el;
    if (window.HSKFX && !window.HSKFX.motionOn()) { node.textContent = text; return; }
    node.textContent = '';
    var i = 0, step = speed || 14;
    clearInterval(node._hskT);
    node._hskT = setInterval(function () {
      i++;
      node.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(node._hskT);
    }, step);
  }

  /* تغییر حالت ربات + واکنش کوتاه */
  function mood(root, name, hold) {
    var nodes = root ? [root] : Array.prototype.slice.call(document.querySelectorAll('.hk-robot'));
    nodes.forEach(function (n) {
      if (!n) return;
      Array.prototype.slice.call(n.classList).forEach(function (c) {
        if (c.indexOf('mood-') === 0) n.classList.remove(c);
      });
      n.classList.add('mood-' + (name || 'idle'));
      n.setAttribute('data-mood', name || 'idle');
      if (hold) {
        clearTimeout(n._hskMood);
        n._hskMood = setTimeout(function () { mood(n, 'idle'); }, hold);
      }
    });
  }
  function react(name, hold) { mood(null, name, hold || 1600); }

  window.HKSAY = { sprite: sprite, svg: svg, head: head, avatar: avatar, bubble: bubble, type: type, mood: mood, react: react };
})();

/* ===== fx.js ===== */
/* =====================================================================
   هوشیکا · موتور حرکت
   ذرات، ظهور تدریجی، حباب سه‌بعدی، تیلت کارت‌ها، کانفتی و شمارنده‌ها
   ===================================================================== */
(function () {
  'use strict';

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var still = false;
  try { still = localStorage.getItem('hsk.still') === '1'; } catch (e) { }

  function motionOn() { return !still && !reduced; }
  /* جلوه‌های تعاملی (هاور/تیلت) حتی با prefers-reduced-motion کار می‌کنند؛
     فقط حالت آرام دستی آن‌ها را خاموش می‌کند. */
  function interactive() { return !still; }

  /* ------------------------------------------------------- ذرات پس‌زمینه */
  var canvas, ctx, dots = [], raf = null, W = 0, H = 0;

  function initCanvas() {
    canvas = document.createElement('canvas');
    canvas.className = 'fx-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');
    resize();
    var count = Math.max(26, Math.min(70, Math.round(window.innerWidth / 26)));
    dots = [];
    for (var i = 0; i < count; i++) {
      dots.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.00028,
        vy: (Math.random() - 0.5) * 0.00028,
        r: 0.8 + Math.random() * 1.9,
        hue: Math.random() > 0.62 ? '155,255,122' : (Math.random() > 0.5 ? '139,125,255' : '77,226,255')
      });
    }
    window.addEventListener('resize', resize);
    if (motionOn()) loop();
  }
  function resize() {
    if (!canvas) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function loop() {
    if (raf) cancelAnimationFrame(raf);
    var w = window.innerWidth, h = window.innerHeight;
    (function frame() {
      if (!motionOn()) { raf = null; return; }
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0 || d.x > 1) d.vx *= -1;
        if (d.y < 0 || d.y > 1) d.vy *= -1;
        var x = d.x * w, y = d.y * h;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + d.hue + ',0.5)';
        ctx.arc(x, y, d.r, 0, Math.PI * 2);
        ctx.fill();
        for (var j = i + 1; j < dots.length; j++) {
          var e = dots[j], ex = e.x * w, ey = e.y * h;
          var dx = x - ex, dy = y - ey, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 148) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(77,226,255,' + (0.1 * (1 - dist / 148)).toFixed(3) + ')';
            ctx.lineWidth = 0.7;
            ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
          }
        }
      }
      raf = requestAnimationFrame(frame);
    })();
  }

  /* موج انفجار ذرات روی کلیک (بدون مانع کلیک) */
  function burst(x, y, color) {
    if (!motionOn() || !canvas) return;
    var parts = [], n = 16;
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random();
      parts.push({ x: x, y: y, vx: Math.cos(a) * (1.6 + Math.random() * 2.4), vy: Math.sin(a) * (1.6 + Math.random() * 2.4), life: 1 });
    }
    var c = canvas.getContext('2d');
    (function tick() {
      var alive = false;
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p.life <= 0) continue;
        alive = true;
        p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.03; p.life -= 0.026;
        c.beginPath();
        c.fillStyle = color || 'rgba(77,226,255,' + Math.max(0, p.life).toFixed(2) + ')';
        c.arc(p.x, p.y, 2.4 * p.life + 0.6, 0, Math.PI * 2);
        c.fill();
      }
      if (alive) requestAnimationFrame(tick);
    })();
  }

  /* --------------------------------------------------- ظهور هنگام اسکرول */
  var io = null;
  function observer() {
    if (!window.IntersectionObserver) return;
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  }
  function reveal(scope) {
    var root = scope || document;
    var list = root.querySelectorAll('.rv:not(.is-in)');
    if (!io || !motionOn()) {
      Array.prototype.forEach.call(list, function (el) { el.classList.add('is-in'); });
      return;
    }
    Array.prototype.forEach.call(list, function (el, i) {
      el.style.transitionDelay = Math.min(i * 45, 320) + 'ms';
      io.observe(el);
    });
  }

  /* ------------------------------------------------ حباب سه‌بعدی (تراشه‌ها) */
  function bubbles(scope) {
    var root = scope || document;
    var list = root.querySelectorAll('.chip, .fx-bubble');
    Array.prototype.forEach.call(list, function (el) {
      if (el._hskBub) return;
      el._hskBub = true;
      el.addEventListener('mousemove', function (ev) {
        if (!interactive()) return;
        var r = el.getBoundingClientRect();
        var mx = (ev.clientX - r.left) / r.width;
        var my = (ev.clientY - r.top) / r.height;
        el.style.setProperty('--mx', (mx * 100).toFixed(1) + '%');
        el.style.setProperty('--my', (my * 100).toFixed(1) + '%');
        el.style.setProperty('--rx', ((0.5 - my) * 14).toFixed(2) + 'deg');
        el.style.setProperty('--ry', ((mx - 0.5) * 16).toFixed(2) + 'deg');
      });
      el.addEventListener('mouseleave', function () {
        el.style.setProperty('--rx', '0deg');
        el.style.setProperty('--ry', '0deg');
        el.style.setProperty('--mx', '50%');
        el.style.setProperty('--my', '40%');
      });
    });
  }

  /* ------------------------------------------------------- تیلت کارت‌ها */
  function tilt(scope) {
    var root = scope || document;
    var list = root.querySelectorAll('.tilt:not([data-tilt-bound])');
    Array.prototype.forEach.call(list, function (el) {
      el.setAttribute('data-tilt-bound', '1');
      el.addEventListener('mousemove', function (ev) {
        if (!interactive()) return;
        var r = el.getBoundingClientRect();
        var px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
        el.style.setProperty('--rx', ((0.5 - py) * 9).toFixed(2) + 'deg');
        el.style.setProperty('--ry', ((px - 0.5) * 11).toFixed(2) + 'deg');
        el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      });
      el.addEventListener('mouseleave', function () {
        el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg');
      });
    });
  }

  /* --------------------------------------------------------- شمارنده‌ها */
  function counters(scope) {
    var root = scope || document;
    var list = root.querySelectorAll('[data-count]:not([data-count-done])');
    Array.prototype.forEach.call(list, function (el) {
      var to = parseFloat(el.getAttribute('data-count')) || 0;
      var suffix = el.getAttribute('data-suffix') || '';
      if (!motionOn()) { el.textContent = HSK.util.faNum(to) + suffix; el.setAttribute('data-count-done', '1'); return; }
      var from = 0, t0 = performance.now(), dur = 900;
      el.setAttribute('data-count-done', '1');
      (function step(now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        el.textContent = HSK.util.faNum(from + (to - from) * eased) + suffix;
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }

  /* -------------------------------------------------------------- کانفتی */
  function confetti(x, y, n) {
    if (!motionOn()) return;
    var colors = ['#4de2ff', '#8b7dff', '#9bff7a', '#ffc94d', '#ff7bb0'];
    var box = document.createElement('div');
    box.className = 'fx-confetti';
    document.body.appendChild(box);
    var total = n || 26;
    for (var i = 0; i < total; i++) {
      var p = document.createElement('i');
      var a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 170;
      p.style.setProperty('--tx', Math.cos(a) * d + 'px');
      p.style.setProperty('--ty', (Math.sin(a) * d - 40) + 'px');
      p.style.background = colors[i % colors.length];
      p.style.left = (x || window.innerWidth / 2) + 'px';
      p.style.top = (y || window.innerHeight / 3) + 'px';
      p.style.animationDelay = (Math.random() * 120).toFixed(0) + 'ms';
      p.style.width = (5 + Math.random() * 6).toFixed(0) + 'px';
      p.style.height = (7 + Math.random() * 8).toFixed(0) + 'px';
      box.appendChild(p);
    }
    setTimeout(function () { box.remove(); }, 1500);
  }

  /* ------------------------------------------------------- نوار پیشرفت */
  function scrollProgress() {
    var bar = document.createElement('div');
    bar.className = 'fx-progress';
    document.body.appendChild(bar);
    var scroller = document.getElementById('hsk-app');
    function update() {
      var el = scroller && scroller.scrollHeight > scroller.clientHeight + 4 ? scroller : document.documentElement;
      var top = el.scrollTop || window.scrollY || 0;
      var max = (el.scrollHeight - el.clientHeight) || 1;
      bar.style.transform = 'scaleX(' + Math.max(0, Math.min(1, top / max)) + ')';
    }
    ['scroll', 'resize'].forEach(function (ev) {
      (scroller || window).addEventListener(ev, update, { passive: true });
      if (scroller) window.addEventListener(ev, update, { passive: true });
    });
    update();
    return update;
  }

  /* ------------------------------------------------------- درخشش نشانگر */
  function cursorGlow() {
    if (!motionOn() || window.matchMedia('(hover: none)').matches) return;
    var g = document.createElement('div');
    g.className = 'fx-glow';
    document.body.appendChild(g);
    var tx = window.innerWidth / 2, ty = window.innerHeight / 3, cx = tx, cy = ty;
    window.addEventListener('mousemove', function (e) { tx = e.clientX; ty = e.clientY; }, { passive: true });
    (function tick() {
      cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
      g.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px)';
      requestAnimationFrame(tick);
    })();
  }

  /* ---------------------------------------------------------- فعال‌سازی */
  function boot() {
    document.documentElement.classList.toggle('still', still);
    initCanvas();
    observer();
    scrollProgress();
    cursorGlow();
    document.addEventListener('click', function (e) {
      var bubble = e.target.closest && e.target.closest('.chip, .btn, .nav-link');
      if (bubble) burst(e.clientX, e.clientY, 'rgba(155,255,122,0.75)');
    });
    refresh(document);
  }
  function refresh(scope) {
    reveal(scope); bubbles(scope); tilt(scope); counters(scope);
  }
  function setStill(on) {
    still = !!on;
    try { localStorage.setItem('hsk.still', still ? '1' : '0'); } catch (e) { }
    document.documentElement.classList.toggle('still', still);
    if (still) { if (raf) cancelAnimationFrame(raf); raf = null; if (ctx) ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
    else if (!raf) loop();
  }
  function getStill() { return still; }

  window.HSKFX = {
    boot: boot, refresh: refresh, burst: burst, confetti: confetti,
    setStill: setStill, getStill: getStill, motionOn: motionOn, interactive: interactive
  };
})();

/* ===== app.js ===== */
/* =====================================================================
   هوشیکا · هستهٔ اپلیکیشن
   حساب‌ها، وضعیت، امتیاز، مأموریت، دستاورد، لیگ، مسیر و رابط کاربری
   ===================================================================== */
(function () {
  'use strict';

  var U = HSK.util;
  var K_USERS = 'hsk.users', K_SESSION = 'hsk.session', K_DATA = 'hsk.data.';

  function read(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function today() { return U.dayKey(); }
  function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return U.dayKey(d); }
  function minutesAgo(ts) { return (Date.now() - ts) / 60000; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
  function phoneOk(v) { return /^09\d{9}$/.test(v.replace(/[^\d]/g, '')); }
  function normPhone(v) { var d = v.replace(/[^\d]/g, ''); if (d.indexOf('98') === 0) d = '0' + d.slice(2); if (d.indexOf('9') === 0 && d.length === 10) d = '0' + d; return d; }

  var state = {
    user: null,
    route: { name: 'home', params: {} },
    menuOpen: false,
    auth: { mode: 'signup', method: 'phone', step: 'form', contact: '', code: '', name: '' },
    onboarding: null
  };

  /* ------------------------------------------------------------ ذخیره‌سازی */
  function users() { return read(K_USERS, {}); }
  function saveUsers(u) { write(K_USERS, u); }
  function saveUser() {
    if (!state.user) return;
    write(K_DATA + state.user.contact, state.user);
    var list = users();
    list[state.user.contact] = {
      contact: state.user.contact, method: state.user.method, name: state.user.name,
      pw: state.user.pw, avatar: state.user.avatar, createdAt: state.user.createdAt
    };
    saveUsers(list);
  }
  function loadUser(contact) {
    var fresh = read(K_DATA + contact, null);
    var meta = users()[contact] || {};
    if (fresh) { state.user = Object.assign(baseUser(), meta, fresh); }
    else state.user = Object.assign(baseUser(), meta, { contact: contact });
    normalize(state.user);
    saveUser();
    return state.user;
  }
  function baseUser() {
    return {
      contact: '', method: 'guest', name: 'کاشف', pw: '', avatar: 'robot-a', avatarColor: '#4de2ff',
      createdAt: Date.now(), xp: 0, xpLog: [], lessons: {}, started: {}, days: [], streak: 0, lastDay: '',
      answered: 0, correct: 0, combo: 0, bestCombo: 0, missionsDone: 0, achievements: [], flags: {},
      missions: { date: '', items: [] }, onboard: { done: false, goalCat: '', goalCourse: '', why: '', level: 0, score: 0, total: 0 },
      prefs: { still: false }
    };
  }
  function normalize(u) {
    if (!u.lessons) u.lessons = {};
    if (!u.started) u.started = {};
    if (!u.days) u.days = [];
    if (!u.flags) u.flags = {};
    if (!u.prefs) u.prefs = {};
    if (!u.onboard) u.onboard = { done: false };
    if (!u.xpLog) u.xpLog = [];
  }

  /* ---------------------------------------------------------------- حساب‌ها */
  function createUser(contact, method, name, pw) {
    var meta = { contact: contact, method: method, name: name || 'کاشف', pw: pw || '', avatar: 'robot-a', avatarColor: '#4de2ff', createdAt: Date.now() };
    var list = users();
    list[contact] = meta;
    saveUsers(list);
    state.user = Object.assign(baseUser(), meta);
    normalize(state.user);
    write(K_SESSION, contact);
    saveUser();
    markActive(true);
    return state.user;
  }
  function loginAs(contact) {
    write(K_SESSION, contact);
    loadUser(contact);
    markActive(false);
  }
  function logout() {
    state.user = null;
    write(K_SESSION, '');
    go('#/auth');
  }
  function deleteAccount() {
    var list = users();
    if (state.user) {
      delete list[state.user.contact];
      saveUsers(list);
      try { localStorage.removeItem(K_DATA + state.user.contact); } catch (e) { }
    }
    state.user = null;
    write(K_SESSION, '');
    go('#/auth');
  }

  /* ------------------------------------------------------ فعالیت و پیوستگی */
  function markActive(silent) {
    var u = state.user;
    if (!u) return;
    var d = today();
    if (u.lastDay !== d) {
      u.streak = (u.lastDay === yesterday()) ? (u.streak || 0) + 1 : 1;
      u.lastDay = d;
      if (u.days.indexOf(d) < 0) u.days.push(d);
      var h = new Date().getHours();
      if (h >= 0 && h < 5) u.flags.night = true;
      if (h < 8) u.flags.early = true;
      if (!silent && u.streak > 1) toast({ icon: '🔥', title: 'زنجیرهٔ ' + U.fa(u.streak) + ' روزه!', text: 'امروز ادامه بده تا نشکند.' });
      saveUser();
    }
    ensureMissions();
  }
  function dailyBonus() {
    var u = state.user;
    if (!u || u.flags['bonus-' + today()]) return;
    u.flags['bonus-' + today()] = true;
    addXp(15, 'streak', 'پاداش پیوستگی روزانه', true);
  }

  /* ------------------------------------------------------------- مأموریت‌ها */
  function ensureMissions() {
    var u = state.user;
    if (!u) return;
    if (!u.missions || u.missions.date !== today()) {
      u.missions = { date: today(), items: HSK.missionsFor(today(), u.contact || 'x') };
      saveUser();
    }
  }
  function bumpMission(kind, n) {
    var u = state.user;
    if (!u) return;
    ensureMissions();
    u.missions.items.forEach(function (m) {
      if (m.kind !== kind || m.claimed) return;
      m.progress = Math.min(m.goal, (m.progress || 0) + n);
    });
    saveUser();
  }
  function missionReady(m) { return m.progress >= m.goal && !m.claimed; }
  function claimMission(id, ev) {
    var u = state.user;
    var m = u.missions.items.filter(function (x) { return x.id === id; })[0];
    if (!m || m.claimed || m.progress < m.goal) return;
    m.claimed = true;
    u.missionsDone = (u.missionsDone || 0) + 1;
    addXp(m.xp, 'mission', 'پاداش مأموریت روزانه');
    toast({ icon: '🎖', title: 'مأموریت کامل شد!', text: '+' + U.fa(m.xp) + ' امتیاز', cls: 'win' });
    saveUser();
    if (ev) HSKFX.confetti(ev.clientX, ev.clientY, 22);
    render();
  }

  /* ------------------------------------------------------------- امتیاز (XP) */
  function addXp(amount, kind, note, silent) {
    var u = state.user;
    if (!u || !amount) return;
    u.xp += amount;
    u.xpLog.push({ ts: Date.now(), amount: amount, kind: kind });
    if (kind !== 'streak') bumpMission('xp', amount);
    saveUser();
    updatePills();
    if (!silent) floatXp(amount);
    checkAchievements();
  }
  function floatXp(amount) {
    var pill = document.querySelector('.pill.xp');
    var n = document.createElement('div');
    n.className = 'xp-float';
    n.textContent = '+' + U.fa(amount) + ' امتیاز';
    var r = pill ? pill.getBoundingClientRect() : { left: window.innerWidth - 120, top: 40 };
    n.style.left = (r.left - 30) + 'px';
    n.style.top = (r.top + 4) + 'px';
    document.body.appendChild(n);
    setTimeout(function () { n.remove(); }, 1400);
  }
  function updatePills() {
    var u = state.user;
    if (!u) return;
    var xp = document.querySelector('.pill.xp b');
    if (xp) xp.textContent = U.faNum(u.xp);
    var st = document.querySelector('.pill.streak b');
    if (st) st.textContent = U.fa(u.streak || 0);
  }
  function levelInfo() { return HSK.levelOf(state.user ? state.user.xp : 0); }

  /* --------------------------------------------------------------- پیشرفت */
  function lessonKey(courseId, index) { return courseId + ':' + index; }
  function lessonDone(courseId, index) { return !!(state.user && state.user.lessons[lessonKey(courseId, index)]); }
  function courseProgress(course) {
    var done = 0;
    for (var i = 0; i < course.topics.length; i++) if (lessonDone(course.id, i)) done++;
    return { done: done, total: course.topics.length, pct: Math.round((done / course.topics.length) * 100) };
  }
  function nextLesson(course) {
    for (var i = 0; i < course.topics.length; i++) if (!lessonDone(course.id, i)) return i;
    return -1;
  }
  function completeLesson(course, index, ev) {
    var u = state.user, key = lessonKey(course.id, index), first = !u.lessons[key];

    if (first) {
      addXp(10, 'lesson', 'تکمیل درس');
      bumpMission('lessons', 1);
      var mod = Math.floor(index / 4);
      var modDone = true;
      for (var i = mod * 4; i < Math.min((mod + 1) * 4, course.topics.length); i++) if (!lessonDone(course.id, i)) modDone = false;
      if (modDone) bumpMission('module', 1);

      var ok = false;
      try { ok = a.test(s); } catch (e) { ok = false; }
      if (ok) { u.achievements.push(a.id); unlocked.push(a); }

    if (unlocked.length) {

    else {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 1) % 7));
      d.setHours(0, 0, 0, 0);
      start = d.getTime();

    rows.sort(function (a, b) { return b.xp - a.xp; });
