      u.flags.guest = true;
      app.saveUser();
      app.toast({ icon: '👋', title: 'خوش آمدی مهمان!', text: 'پیشرفتت روی همین دستگاه ذخیره می‌شود.' });
      app.go('#/onboarding');
    });

    var form = app.$('#authForm', root);
    if (form) {
      var nameEl = app.$('#f-name', root), contactEl = app.$('#f-contact', root), pwEl = app.$('#f-pw', root);
      var err = app.$('#authErr', root);
      if (contactEl) setTimeout(function () { contactEl.focus(); }, 120);
      function fail(msg, el) {
        err.textContent = msg;
        err.hidden = false;
        if (el) { el.classList.add('err'); el.addEventListener('input', function once() { el.classList.remove('err'); err.hidden = true; el.removeEventListener('input', once); }); }
      }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var contact = (contactEl.value || '').trim();
        var list = app.users();
        if (a.method === 'phone') {
          contact = app.normPhone(contact);
          if (!app.phoneOk(contact)) return fail('شمارهٔ موبایل باید با ۰۹ شروع شود و ۱۱ رقم باشد.', contactEl);
        } else {
          if (!app.emailOk(contact)) return fail('ایمیل معتبر نیست؛ مثلاً you@gmail.com', contactEl);
        }
        if (a.method === 'email') {
          var pw = pwEl.value || '';
          if (pw.length < 6) return fail('رمز عبور باید حداقل ۶ کاراکتر باشد.', pwEl);
          a.pw = pw;
        }
        if (a.mode === 'login') {
          if (!list[contact]) return fail('حسابی با این ' + (a.method === 'phone' ? 'شماره' : 'ایمیل') + ' پیدا نشد. اول ثبت‌نام کن.', contactEl);
          if (a.method === 'email') {
            if ((list[contact].pw || '') !== a.pw) return fail('رمز عبور درست نیست.', pwEl);
            app.loginAs(contact);
            app.toast({ icon: '👋', title: 'خوش برگشتی ' + app.state.user.name + '!', text: 'ادامه بده از همان جایی که ماندی.' });
            app.go('#/home');
            return app.render();
          }
        }
        a.contact = contact;
        a.name = nameEl ? (nameEl.value || '').trim() : '';
        a.code = String(Math.floor(10000 + Math.random() * 89999));
        a.step = 'otp';
        app.render();
      });
    }

    var otp = app.$('#otpForm', root);
    if (otp) {
      var cells = app.$$('.otp-cell', root);
      cells[0].focus();
      cells.forEach(function (c, i) {
        c.addEventListener('input', function () {
          c.value = c.value.replace(/\D/g, '');
          if (c.value && cells[i + 1]) cells[i + 1].focus();
        });
        c.addEventListener('keydown', function (ev) {
          if (ev.key === 'Backspace' && !c.value && cells[i - 1]) cells[i - 1].focus();
        });
        c.addEventListener('paste', function (ev) {
          var text = (ev.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 5);
          if (!text) return;
          ev.preventDefault();
          text.split('').forEach(function (d, j) { if (cells[j]) cells[j].value = d; });
          if (cells[text.length]) cells[text.length].focus();
        });
      });
      app.on(root, '[data-x="back"]', 'click', function () { a.step = 'form'; app.render(); });
      app.on(root, '[data-x="fill"]', 'click', function () {
        String(a.code).split('').forEach(function (d, i) { if (cells[i]) cells[i].value = d; });
        cells[4].focus();
      });
      otp.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var err = app.$('#otpErr', root);
        var typed = cells.map(function (c) { return c.value; }).join('');
        if (typed.length < 5) { err.textContent = 'کد پنج‌رقمی را کامل وارد کن.'; err.hidden = false; return; }
        if (typed !== String(a.code)) {
          err.textContent = 'کد درست نیست. دوباره امتحان کن.';
          err.hidden = false;
          HKSAY.react('sad', 1500);
          return;
        }
        var list = app.users();
        if (a.mode === 'login' || list[a.contact]) {
          app.loginAs(a.contact);
          HKSAY.react('happy', 2000);
          app.toast({ icon: '🤖', title: 'خوش برگشتی ' + app.state.user.name + '!', text: 'بریم سراغ ادامهٔ مسیر.' });
          app.go(app.state.user.onboard.done ? '#/home' : '#/onboarding');
        } else {
          var u = app.createUser(a.contact, a.method, a.name || 'کاشف', a.pw || '');
          HKSAY.react('happy', 2400);
          app.toast({ icon: '🎉', title: 'حسابت ساخته شد!', text: 'حالا بگو دوست داری چه چیزی یاد بگیری.' });
          u.flags.fresh = true;
          app.saveUser();
          app.go('#/onboarding');
        }
        a.step = 'form';
        app.render();
      });
    }
    HSKFX.refresh(root);
  }

  V.auth = function (a) {
    return {
      html: '<div class="auth">' + brandSide() +
        '<div class="auth-card"><div class="auth-box">' +
        '<div class="row" style="gap:12px;margin-bottom:18px">' + HKSAY.head(40) +
        '<div><div class="brand-name">' + HSK.BRAND.name + '<span>.</span></div>' +
        '<div class="brand-sub">' + HSK.BRAND.claim + '</div></div></div>' +
        (a.step === 'otp' ? otpStep(a) : formStep(a)) +
        '</div></div></div>',
      bind: bind
    };
  };
})();

/* ===== v-onboard.js ===== */
/* =====================================================================
   هوشیکا · نما: آنبوردینگ هوشمند (هدف → درس → انگیزه → تجربه → تست سطح)
   ===================================================================== */
(function () {
  'use strict';
  var V = (window.HSKVIEWS = window.HSKVIEWS || {});
  var U = HSK.util;
  function A() { return window.HSKAPP; }

  var WHY = [
    { id: 'job', icon: '💼', t: 'رسیدن به شغل و درآمد', d: 'دنبال کار برنامه‌نویسی یا فریلنسری هستم.' },
    { id: 'project', icon: '🛠', t: 'ساختن پروژه و ایده', d: 'یک ایده دارم و می‌خواهم بسازمش.' },
    { id: 'fun', icon: '🎈', t: 'کنجکاوی و علاقه', d: 'برای خودم جذاب است و دوست دارم یاد بگیرم.' },
    { id: 'school', icon: '🎓', t: 'درس و دانشگاه', d: 'برای درس‌هام به آن نیاز دارم.' },
    { id: 'game', icon: '🎮', t: 'ساختن بازی', d: 'می‌خواهم بازی خودم را بسازم.' },
    { id: 'ai', icon: '🤖', t: 'کار با هوش مصنوعی', d: 'می‌خواهم با AI ابزار بسازم.' }
  ];
  var EXP = [
    { id: 1, icon: '🌱', t: 'هیچ آشنایی ندارم', d: 'از صفر و قدم‌به‌قدم شروع می‌کنیم.' },
    { id: 2, icon: '🌿', t: 'کمی آشنا هستم', d: 'چند چیز بلدم ولی منظم نیست.' },
    { id: 3, icon: '🌳', t: 'خوب بلدم', d: 'می‌خواهم عمیق‌تر و حرفه‌ای‌تر شوم.' }
  ];

  function fresh() {
    return {
      step: 0, cat: '', course: '', why: '', exp: 0,
      qIndex: 0, tier: 2, used: [], correct: 0, asked: 0,
      current: null, feedback: null, result: null
    };
  }
  function state() {
    var a = A().state;
    if (!a.onboarding) a.onboarding = fresh();
    return a.onboarding;
  }

  function pickQuestion(ob) {
    var bank = HSK.QB[ob.cat] || HSK.QB.lang;
    var tier = ob.tier;
    var pool = bank.filter(function (q) { return q.tier === tier && ob.used.indexOf(q.text) < 0; });
    if (!pool.length) {
      pool = bank.filter(function (q) { return ob.used.indexOf(q.text) < 0; });
    }
    if (!pool.length) return null;
    var q = pool[U.hash(ob.cat + ob.qIndex + tier) % pool.length];
    ob.used.push(q.text);
    ob.current = { text: q.text, opts: q.opts, ans: q.ans, why: q.why, tier: q.tier };
    return ob.current;
  }

  function progressBar() {
    var ob = state();
    var total = 5, done = ob.qIndex;
    if (ob.step < 4) return '';
    return '<div class="bar slim"><i style="width:' + Math.round((done / total) * 100) + '%"></i></div>';
  }

  function step0() {
    return '' +
      '<div class="row" style="gap:16px;align-items:flex-start;margin-bottom:20px">' +
      HKSAY.svg({ mood: 'happy', size: '150px' }) +
      '<div class="grow">' + HKSAY.bubble(HSK.LINES.ask_goal[0]) +
      '<div class="question-title" style="margin-top:14px">می‌خواهی چه درسی یاد بگیری؟</div>' +
      '<p class="question-description">یک رشته انتخاب کن؛ من بانک درس‌های آن را نشانت می‌دهم و بعد مسیرت را می‌سازم.</p></div></div>' +
      '<div class="answer-options">' +
      HSK.CATS.map(function (c) {
        var n = HSK.COURSES.filter(function (x) { return x.cat === c.id; }).length;
        return '<button class="answer-option goal-tile" data-cat="' + c.id + '" data-state="' + (state().cat === c.id ? 'on' : 'off') + '">' +
          '<span class="gt-icon" style="color:' + c.color + '">' + c.icon + '</span>' +
          '<strong>' + c.title + '</strong><p>' + c.blurb + '</p>' +
          '<span class="badge ghost small">' + U.fa(n) + ' دوره</span></button>';
      }).join('') +
      '<button class="answer-option goal-tile" data-x="surprise" data-state="off">' +
      '<span class="gt-icon">🎲</span><strong>نمی‌دانم؛ تو انتخاب کن</strong>' +
      '<p>بر اساس محبوب‌ترین مسیرها برایت پیشنهاد می‌دهم.</p></button>' +
      '</div>';
  }

  function step1() {
    var ob = state(), cat = HSK.catById(ob.cat);
    var courses = HSK.COURSES.filter(function (c) { return c.cat === ob.cat; })
      .sort(function (a, b) { return a.level - b.level; });
    return '' +
      '<div class="row" style="gap:14px;align-items:center;margin-bottom:14px">' +
      '<span class="icon-badge">' + (cat ? cat.icon : '📘') + '</span>' +
      '<div class="grow"><div class="question-title" style="margin:0">کدام درس را شروع کنیم؟</div>' +
      '<p class="question-description" style="margin:0">' + U.fa(courses.length) + ' دوره در «' + (cat ? cat.title : '') + '» هست. هر کدام را انتخاب کردی، مسیر همان را می‌سازم.</p></div></div>' +
      '<div class="answer-options">' +
      courses.map(function (c) {
        return '<button class="answer-option" data-course="' + c.id + '" data-state="' + (ob.course === c.id ? 'on' : 'off') + '">' +
          '<span class="ao-num">' + c.code + '</span>' +
          '<strong style="font-weight:400">' + c.title + '</strong>' +
          '<p class="small muted" style="margin:6px 0 0">' + c.desc + '</p>' +
          '<div class="cc-meta" style="margin-top:8px"><span>📚 ' + U.fa(c.topics.length) + ' درس</span>' +
          '<span>⏱ ' + U.fa(c.hours) + ' ساعت</span><span>✨ ' + U.fa(c.xp) + ' امتیاز</span>' +
          '<span>📈 سطح ' + U.fa(c.level) + ' از ۵</span></div></button>';
      }).join('') + '</div>';
  }

  function step2() {
    var ob = state();
    return '' +
      '<div class="question-title">چرا می‌خواهی این را یاد بگیری؟</div>' +
      '<p class="question-description">این جواب، لحن مسیر و پروژه‌های پیشنهادی را مشخص می‌کند.</p>' +
      '<div class="answer-options">' +
      WHY.map(function (w) {
        return '<button class="answer-option" data-why="' + w.id + '" data-state="' + (ob.why === w.id ? 'on' : 'off') + '">' +
          '<span class="gt-icon">' + w.icon + '</span><strong style="font-weight:400;display:block;margin-top:6px">' + w.t + '</strong>' +
          '<p class="small muted" style="margin:4px 0 0">' + w.d + '</p></button>';
      }).join('') + '</div>';
  }

  function step3() {
    var ob = state();
    return '' +
      '<div class="question-title">چقدر با این موضوع آشنا هستی؟</div>' +
      '<p class="question-description">صادق باش! این جواب فقط نقطهٔ شروع تست سطح را تعیین می‌کند.</p>' +
      '<div class="answer-options">' +
      EXP.map(function (e) {
        return '<button class="answer-option" data-exp="' + e.id + '" data-state="' + (ob.exp === e.id ? 'on' : 'off') + '">' +
          '<span class="gt-icon">' + e.icon + '</span><strong style="font-weight:400;display:block;margin-top:6px">' + e.t + '</strong>' +
          '<p class="small muted" style="margin:4px 0 0">' + e.d + '</p></button>';
      }).join('') + '</div>';
  }

  function step4() {
    var ob = state();
    if (!ob.current) pickQuestion(ob);
    var q = ob.current;
    var mood = ob.feedback ? (ob.feedback.ok ? 'happy' : 'sad') : 'think';
    return '' +
      '<div class="panel quiz-card">' +
      '<div class="wizard-top"><span>سؤال ' + U.fa(ob.qIndex + 1) + ' از ۵</span><span>سطح تست: ' + ['', 'آسان', 'متوسط', 'سخت'][q.tier] + '</span></div>' +
      progressBar() +
      '<div class="row" style="gap:14px;align-items:flex-start;margin:16px 0">' +
      HKSAY.svg({ mood: mood, size: '128px' }) +
      '<div class="grow">' + HKSAY.bubble(ob.feedback ? ob.feedback.say : HSK.LINES.quiz[0]) + '</div></div>' +
      '<div class="question-title">' + q.text + '</div>' +
      (q.why && ob.feedback ? '<p class="explain ' + (ob.feedback.ok ? 'right' : 'wrong') + '">' + q.why + '</p>' : '') +
      '<div class="answer-options">' +
      q.opts.map(function (o, i) {
        var st = 'off';
        if (ob.feedback) {
          if (i === q.ans) st = 'right';
          else if (i === ob.chosen) st = 'wrong';
        }
        return '<button class="answer-option" data-answer="' + i + '" data-state="' + st + '"' + (ob.feedback ? ' disabled' : '') + '>' +
          '<span class="ao-num">' + U.fa(i + 1) + '</span>' + o + '</button>';
      }).join('') + '</div>' +
      '<div class="wizard-actions">' +
      '<span class="hint">امتیاز فعلی تست: ' + U.fa(ob.correct) + ' از ' + U.fa(ob.asked) + '</span>' +
      '<button class="btn primary" data-x="next" ' + (ob.feedback ? '' : 'disabled') + '>' +
      (ob.qIndex >= 4 ? 'دیدن نتیجه' : 'سؤال بعدی →') + '</button>' +
      '</div></div>';
  }

  function step5() {
    var ob = state(), r = ob.result, course = HSK.courseById(ob.course);
    if (!r) return '';
    return '' +
      '<div class="panel quiz-card center" style="padding:30px">' +
      '<div class="row" style="justify-content:center;gap:18px;align-items:center">' +
      HKSAY.svg({ mood: 'proud', size: '190px' }) +
      '<div style="text-align:right">' +
      '<span class="kicker">نتیجهٔ سطح‌بندی</span>' +
      '<h2 style="margin:6px 0">سطح ' + U.fa(r.level) + ' — ' + r.title + '</h2>' +
      '<p class="muted" style="margin:0">' + r.note + '</p></div></div>' +
      '<div class="summary-stats" style="display:flex;gap:30px;justify-content:center;margin:22px 0;flex-wrap:wrap">' +
      '<div><strong style="font-family:var(--font-display);font-size:26px;color:var(--cyan)">' + U.fa(ob.correct) + '/' + U.fa(ob.asked) + '</strong><div class="small muted">پاسخ درست</div></div>' +
      '<div><strong style="font-family:var(--font-display);font-size:26px;color:var(--lime)">' + U.fa(course ? course.hours : 0) + ' ساعت</strong><div class="small muted">زمان تخمینی مسیر</div></div>' +
      '<div><strong style="font-family:var(--font-display);font-size:26px;color:var(--amber)">' + U.fa(course ? course.topics.length : 0) + ' درس</strong><div class="small muted">در دورهٔ انتخابی</div></div></div>' +
      HKSAY.bubble('از «' + (course ? course.title : '') + '» شروع می‌کنیم و بر اساس سطحت، درس‌های پایه را سریع مرور می‌کنیم. اگر وسط راه سخت شد، تست را دوباره می‌گیریم.') +
      '<div class="wizard-actions" style="justify-content:center;margin-top:22px">' +
      '<button class="btn ghost" data-x="retest">تست را دوباره بده</button>' +
      '<button class="btn primary xl" data-x="start">شروع یادگیری (+۳۰ امتیاز)</button>' +
      '</div></div>';
  }

  function bind(root) {
    var app = A(), ob = state();
    app.on(root, '[data-cat]', 'click', function () {
      ob.cat = this.getAttribute('data-cat');
      ob.step = 1;
      app.render();
    });
    app.on(root, '[data-x="surprise"]', 'click', function () {
      ob.cat = 'lang';
      var best = HSK.COURSES.filter(function (c) { return c.cat === 'lang'; }).sort(function (a, b) { return a.level - b.level; })[0];
      ob.course = best.id;
      ob.step = 2;
      app.toast({ icon: '🎲', title: 'انتخاب هوشیکا', text: 'مسیر «' + best.title + '» را پیشنهاد می‌کنم.' });
      app.render();
    });
    app.on(root, '[data-course]', 'click', function () {
      ob.course = this.getAttribute('data-course');
      ob.step = 2;
      app.render();
    });
    app.on(root, '[data-why]', 'click', function () {
      ob.why = this.getAttribute('data-why');
      ob.step = 3;
      app.render();
    });
    app.on(root, '[data-exp]', 'click', function () {
      ob.exp = parseInt(this.getAttribute('data-exp'), 10);
      ob.tier = ob.exp;
      ob.step = 4;
      ob.qIndex = 0; ob.used = []; ob.correct = 0; ob.asked = 0; ob.current = null; ob.feedback = null;
      app.render();
    });
    app.on(root, '[data-answer]', 'click', function () {
      if (ob.feedback) return;
      var idx = parseInt(this.getAttribute('data-answer'), 10);
      var q = ob.current;
      var ok = idx === q.ans;
      ob.chosen = idx;
      ob.asked++;
      if (ok) {
        ob.correct++;
        ob.tier = Math.min(3, ob.tier + 1);
        ob.feedback = { ok: true, say: U.pick(HSK.LINES.correct, U.hash(q.text)) };
        HKSAY.react('happy', 1800);
      } else {
        ob.tier = Math.max(1, ob.tier - 1);
        ob.feedback = { ok: false, say: U.pick(HSK.LINES.wrong, U.hash(q.text)) };
        HKSAY.react('sad', 1800);
      }
      app.render();
    });
    app.on(root, '[data-x="next"]', 'click', function () {
      if (!ob.feedback) return;
      if (ob.qIndex >= 4) {
        ob.result = HSK.levelFromScore(ob.correct, ob.asked);
        ob.step = 5;
        HKSAY.react('proud', 3000);
        app.render();
        return;
      }
      ob.qIndex++;
      ob.feedback = null;
      pickQuestion(ob);
      app.render();
    });
    app.on(root, '[data-x="retest"]', 'click', function () {
      ob.step = 3; ob.qIndex = 0; ob.used = []; ob.correct = 0; ob.asked = 0; ob.current = null; ob.feedback = null; ob.result = null;
      app.render();
    });
    app.on(root, '[data-x="start"]', 'click', function (ev) {
      var u = app.state.user;
      u.onboard = {
        done: true, goalCat: ob.cat, goalCourse: ob.course, why: ob.why,
        level: ob.result.level, title: ob.result.title, score: ob.correct, total: ob.asked
      };
      u.flags.placement = true;
      app.saveUser();
      app.addXp(30, 'placement', 'تکمیل تست سطح‌بندی');
      HSKFX.confetti(ev.clientX, ev.clientY, 44);
      app.toast({ icon: '🚀', title: 'مسیرت آماده است!', text: 'داشبورد اختصاصی تو ساخته شد.' });
      app.go('#/home');
      app.render();
    });
    HSKFX.refresh(root);
  }

  V.onboarding = function () {
    var ob = state();
    var heads = ['هدف تو', 'انتخاب درس', 'انگیزه', 'تجربه', 'تست سطح', 'نتیجه'];
    var body = [step0, step1, step2, step3, step4, step5][ob.step]();
    return {
      html: '<div class="page narrow">' +
        '<div class="wizard">' +
        '<div class="step-dots">' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i <= ob.step ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="wizard-top"><span>گام ' + U.fa(ob.step + 1) + ' — ' + heads[ob.step] + '</span>' +
        '<span>' + HSK.BRAND.name + ' · سطح‌بندی هوشمند</span></div>' +
        (ob.step === 0 || ob.step === 1 ? '<div class="panel flat" style="padding:20px">' + body + '</div>' : body) +
        (ob.step === 0 ? '<p class="hint center" style="margin-top:16px">بعد از انتخاب رشته، پنج سؤال کوتاه می‌پرسم تا سطحت را دقیق بفهمم.</p>' : '') +
        '</div></div>',
      bind: bind
    };
  };
})();

/* ===== v-home.js ===== */
/* =====================================================================
   هوشیکا · نما: داشبورد یادگیری
   ===================================================================== */
(function () {
  'use strict';
  var V = (window.HSKVIEWS = window.HSKVIEWS || {});

  function bindCatalog(root) {
    var app = A();
    var search = app.$('#courseSearch', root);
    if (search) {
      search.value = filter.q;
      search.addEventListener('input', function () { filter.q = this.value; paint(root); });
      setTimeout(function () { if (filter.q) search.focus(); }, 60);
    }
    app.on(root, '[data-cat-filter]', 'click', function () { filter.cat = this.getAttribute('data-cat-filter'); paint(root); });
    app.on(root, '[data-level-filter]', 'click', function () { filter.level = this.getAttribute('data-level-filter'); paint(root); });
    app.on(root, '[data-sort]', 'change', function () { filter.sort = this.value; paint(root); });
    app.on(root, '[data-course]', 'click', function (ev) {
      var hit = ev.target.closest('[data-course]');
      app.go('#/course/' + hit.getAttribute('data-course'));
    });
  }

  function filtered() {
    var q = filter.q.trim();
    var list = HSK.COURSES.filter(function (c) {
      if (filter.cat !== 'all' && c.cat !== filter.cat) return false;
      if (filter.level !== 'all' && String(c.level) !== filter.level) return false;
      if (q) {
        var hay = (c.title + ' ' + c.desc + ' ' + c.code + ' ' + c.topics.join(' ')).toLowerCase();
        if (hay.indexOf(q.toLowerCase()) < 0) return false;
      }
      return true;
    });
    if (filter.sort === 'level') list.sort(function (a, b) { return a.level - b.level || a.topics.length - b.topics.length; });
    if (filter.sort === 'lessons') list.sort(function (a, b) { return b.topics.length - a.topics.length; });
    if (filter.sort === 'title') list.sort(function (a, b) { return a.title.localeCompare(b.title, 'fa'); });
    return list;
  }

      return '<div class="module ' + (open ? 'open' : '') + '">' +
        '<div class="module-head" data-mod="' + mi + '">' +

        '<div class="module-body">' +
        m.topics.map(function (t, ti) {

        '</div></div>';

    return {
      html: '<div class="page"><div class="stack-lg">' +
        '<section class="course-hero">' +
        '<div class="panel">' +
        '<div class="row" style="gap:10px"><a class="badge ghost" href="#/courses">← همهٔ دوره‌ها</a>' +
        '<span class="badge" style="color:' + course.color + ';border-color:' + course.color + '55">' + cat.short + '</span>' +
        (isGoal ? '<span class="badge cyan">مسیر هدف تو</span>' : '') + '</div>' +
        '<h1 style="margin:12px 0 8px">' + course.title + '</h1>' +
        '<p class="ink2" style="max-width:640px">' + course.desc + '</p>' +
        '<div class="cc-meta" style="margin:10px 0 16px"><span>📚 ' + U.fa(course.topics.length) + ' درس در ' + U.fa(mods.length) + ' ماژول</span>' +
        '<span>⏱ حدود ' + U.fa(course.hours) + ' ساعت</span><span>✨ ' + U.fa(course.xp) + ' امتیاز کل</span>' +
        '<span>📈 سطح ' + U.fa(course.level) + ' از ۵</span></div>' +
        '<div class="progress-line"><div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
        '<span>' + U.fa(p.done) + ' از ' + U.fa(p.total) + ' درس</span></div>' +
        '<div class="row wrap" style="margin-top:16px">' +
        (next >= 0
          ? '<button class="btn primary xl" data-lesson="' + next + '">' + (p.done > 0 ? '▶ ادامه بده' : '▶ شروع کن') + ' — ' + course.topics[next] + '</button>'
          : '<span class="badge lime">دوره کامل شد! 🎉</span>') +
        '<button class="btn ghost" data-go="#/path">مسیر من</button>' +
        '</div></div>' +
        '<div class="panel flat center">' + HKSAY.svg({ mood: p.done === p.total ? 'proud' : 'happy', size: '190px' }) +
        HKSAY.bubble(p.done === p.total
          ? 'این دوره را تمام کردی! حالا می‌توانی یک درس از رشتهٔ دیگری امتحان کنی یا سراغ پروژه بروی.'
          : 'در دورهٔ ' + course.title + ' هر درس یک تست کوتاه دارد؛ هر پاسخ درست ۵ امتیاز و هر درس ۱۰ امتیاز می‌دهد.') +
        '</div></section>' +
        '<section>' + rows + '</section>' +
        '</div></div>',
      bind: function (root) {
        app.on(root, '.module-head', 'click', function () {
          var m = this.parentElement;
          m.classList.toggle('open');
        });
        app.on(root, '[data-lesson]', 'click', function () {
          app.go('#/lesson/' + course.id + '/' + this.getAttribute('data-lesson'));
        });
        HSKFX.refresh(root);
      }
    };
  };
})();

/* =====================================================================
   هوشیکا · نما: درس (توضیح، کد، کارگاه زنده، تست و امتیاز)
   ===================================================================== */
(function () {
  'use strict';
  var V = (window.HSKVIEWS = window.HSKVIEWS || {});
  var U = HSK.util;
  function A() { return window.HSKAPP; }

  var LIVE_CATS = { web: true, lang: true, game: true };

  function liveDefault(course) {
    if (course.id === 'html') {
      return '<h1>سلام هوشیکا!</h1>\n<p>این کد زنده است؛ تغییرش بده و اجرا کن.</p>\n<ul>\n  <li>درس‌ها</li>\n  <li>امتیاز</li>\n</ul>';
    }
    if (course.id === 'css') {
      return '<div class="bubble">سلام!</div>\n<style>\n  .bubble {\n    font-family: sans-serif;\n    padding: 22px;\n    border-radius: 20px;\n    color: #04141c;\n    background: linear-gradient(140deg, #eafcff, #4de2ff);\n    transition: transform .3s;\n  }\n  .bubble:hover { transform: translateY(-6px) scale(1.05); }\n</style>';
    }
    return '<div id="app">امتیاز: <b>۰</b></div>\n<button class="b">یک درس کامل کن</button>\n<script>\n  let xp = 0;\n  const b = document.querySelector(".b");\n  b.addEventListener("click", () => {\n    xp += 10;\n    document.querySelector("b").textContent = xp;\n  });\n<\/script>';
  }
  function runLive(scope) {
    var app = A();
    var ta = app.$('#code-text', scope), frame = app.$('.result iframe', scope);
    if (!ta || !frame) return;
    frame.setAttribute('srcdoc', '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Tahoma,sans-serif;color:#eaf3ff;background:#04101f;padding:14px;margin:0}</style></head><body>' + ta.value + '</body></html>');
    var flagKey = 'lab-' + U.hash(ta.value);
    var u = app.state.user;
    if (!u.flags[flagKey]) {
      u.flags[flagKey] = true;
      app.saveUser();
      app.addXp(5, 'lab', 'تمرین زنده');
      app.toast({ icon: '▶', title: 'کد اجرا شد!', text: '+۵ امتیاز برای تمرین زنده' });
    }
  }

  function bind(root, params) {
    var app = A();
    var course = HSK.courseById(params.id);
    if (!course) return;
    var idx = parseInt(params.sub || '0', 10);
    var u = app.state.user;
    var body = HSK.lessonBody(course, course.topics[idx], idx);
    var sample = HSK.sampleFor(course.id, idx);
    var isLive = !!LIVE_CATS[course.cat] && ['html', 'css', 'javascript', 'python'].indexOf(course.id) >= 0;

    /* اجرای کد زنده */
    if (isLive) {
      var ta = app.$('#code-text', root);
      if (ta && !ta.value) ta.value = liveDefault(course);
      app.on(root, '.run', 'click', function () { runLive(root); });
      app.on(root, '[data-live]', 'click', function () {
        ta.value = this.getAttribute('data-live-code') || ta.value;
        runLive(root);
      });
      var frame = app.$('.result iframe', root);
      if (frame) setTimeout(function () { runLive(root); }, 80);
    }

    app.on(root, '[data-copy]', 'click', function () {
      var ta2 = app.$('#code-text', root);
      var pre = app.$('#code-sample', root);
      var text = ta2 && ta2.value ? ta2.value : (pre ? pre.textContent : '');
      try { navigator.clipboard.writeText(text); } catch (e) { }
      app.toast({ icon: '📋', title: 'کد کپی شد', text: 'می‌توانی در کارگاه کد اجرا کنی.' });
    });

    app.on(root, '[data-lesson]', 'click', function () {
      app.go('#/lesson/' + course.id + '/' + this.getAttribute('data-lesson'));
    });

    /* تکمیل درس و تست */
    app.on(root, '[data-x="review"]', 'click', function (ev) {
      app.completeLesson(course, idx, ev);
      app.dailyBonus();
      var box = app.$('#quizBox', root);
      if (box) { box.hidden = false; box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      this.setAttribute('disabled', 'disabled');
      this.textContent = '✓ این درس ثبت شد';
      HKSAY.react('happy', 2200);
      app.render();
    });

    app.on(root, '[data-qopt]', 'click', function () {
      var qi = parseInt(this.getAttribute('data-q'), 10);
      var oi = parseInt(this.getAttribute('data-qopt'), 10);
      var qs = HSK.quizFor(course, course.topics[idx], idx);
      var q = qs[qi];
      if (!q) return;
      var ok = oi === q.ans;
      var block = app.$('[data-qblock="' + qi + '"]', root);
      if (!block || block.getAttribute('data-done') === '1') return;
      block.setAttribute('data-done', '1');
      app.$$('.answer-option', block).forEach(function (b) {
        b.setAttribute('disabled', 'disabled');
        var bi = parseInt(b.getAttribute('data-qopt'), 10);
        if (bi === q.ans) b.setAttribute('data-state', 'right');
        else if (bi === oi) b.setAttribute('data-state', 'wrong');
      });
      u.answered = (u.answered || 0) + 1;
      if (ok) {
        block.setAttribute('data-right', '1');
        u.correct = (u.correct || 0) + 1;
        u.combo = (u.combo || 0) + 1;
        u.bestCombo = Math.max(u.bestCombo || 0, u.combo);
        app.bumpMission('correct', 1);
        app.addXp(5, 'quiz', 'پاسخ درست');
        app.toast({ icon: '✅', title: 'درست بود!', text: q.why, cls: 'win' });
        HKSAY.react('happy', 1600);
      } else {
        u.combo = 0;
        app.toast({ icon: '💡', title: 'جواب درست را دیدی', text: q.why, cls: 'bad' });
        HKSAY.react('think', 1600);
      }
      var mine = app.$('[data-qblock="' + qi + '"] .explain', root);
      if (mine) { mine.hidden = false; mine.className = 'explain ' + (ok ? 'right' : 'wrong'); mine.textContent = q.why; }
      var doneAll = app.$$('[data-qblock]', root).every(function (b) { return b.getAttribute('data-done') === '1'; });
      if (doneAll) {
        app.bumpMission('quiz', 1);
        var rightAll = app.$$('[data-qblock]', root).every(function (b) {
          return b.getAttribute('data-right') === '1';
        });
        if (rightAll) { u.flags.perfectQuiz = true; app.addXp(10, 'quiz', 'تست بی‌نقص'); }
        app.toast({ icon: '🎯', title: 'تست این درس تمام شد', text: 'می‌توانی درس بعدی را شروع کنی.' });
        var nav = app.$('#quizDone', root);
        if (nav) nav.hidden = false;
      }
      app.saveUser();
      app.checkAchievements();
    });
    HSKFX.refresh(root);
  }

  V.lesson = function (params) {
    var app = A();
    var course = HSK.courseById(params.id);
    if (!course) return { html: '<div class="page"><div class="panel">درس پیدا نشد. <a href="#/courses">فهرست دوره‌ها</a></div></div>', bind: function () { } };
    var idx = Math.max(0, Math.min(course.topics.length - 1, parseInt(params.sub || '0', 10)));
    var topic = course.topics[idx];
    var u = app.state.user;
    var done = app.lessonDone(course.id, idx);
    var body = HSK.lessonBody(course, topic, idx);
    var sample = HSK.sampleFor(course.id, idx);
    var quizzes = HSK.quizFor(course, topic, idx);
    var isLive = !!LIVE_CATS[course.cat] && ['html', 'css', 'javascript', 'python'].indexOf(course.id) >= 0;
    var p = app.courseProgress(course);

    var side = HSK.lessonList(course).map(function (l, i) {
      var st = app.lessonDone(course.id, i) ? 'done' : (i === idx ? 'current' : '');
      return '<div class="lesson-row ' + st + '" data-lesson="' + i + '">' +
        '<span class="l-state">' + (app.lessonDone(course.id, i) ? '✓' : U.fa(i + 1)) + '</span>' +
        '<span class="l-title">' + l.title + '</span></div>';
    }).join('');

    return {
      html: '<div class="page"><div class="stack-lg">' +
        '<section class="row wrap between" style="gap:10px">' +
        '<div class="row wrap"><a class="badge ghost" href="#/course/' + course.id + '">← ' + course.title + '</a>' +
        '<span class="badge">ماژول ' + U.fa(Math.floor(idx / 4) + 1) + '</span>' +
        '<span class="badge ghost">درس ' + U.fa(idx + 1) + ' از ' + U.fa(course.topics.length) + '</span>' +
        (done ? '<span class="badge lime">کامل‌شده ✓</span>' : '<span class="badge amber">+' + U.fa(10) + ' امتیاز</span>') + '</div>' +
        '<div class="progress-line" style="max-width:320px"><div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
        '<span>' + U.fa(p.pct) + '٪</span></div></section>' +

        '<section class="lesson-layout">' +
        '<div class="panel">' +
        '<h1 style="margin:0 0 6px">' + topic + '</h1>' +
        '<p class="muted small">درس ' + U.fa(idx + 1) + ' · ' + course.title + '</p>' +
        '<p class="ink2" style="font-size:17px;margin-top:14px">' + body.intro + '</p>' +
        '<div class="callout"><span>❓</span><p><strong>چرا مهم است؟ </strong>' + body.why + '</p></div>' +

          : '<button class="btn lime" data-go="#/course/' + course.id + '">دوره را کامل مرور کن</button>') +
        '<button class="btn ghost" data-go="#/course/' + course.id + '">بازگشت به دوره</button>' +
        '</div></div>' +

        '<div class="lesson-nav">' +
        (idx > 0 ? '<button class="btn ghost" data-lesson="' + (idx - 1) + '">← درس قبلی</button>' : '<span></span>') +
        (idx + 1 < course.topics.length ? '<button class="btn ghost" data-lesson="' + (idx + 1) + '">درس بعدی →</button>' : '') +
        '</div></div>' +

        '<aside class="lesson-side">' +
        '<div class="panel flat">' + HKSAY.svg({ mood: done ? 'happy' : 'think', size: '150px' }) +
        HKSAY.bubble(done ? U.pick(HSK.LINES.lesson_done, idx) : U.pick(HSK.LINES.lesson_intro, idx)) + '</div>' +

        '<div class="panel tight" style="max-height:420px;overflow:auto"><strong style="font-family:var(--font-display);font-size:17px">درس‌های این دوره</strong>' +

        '</aside>' +
        '</section></div></div>',
      bind: function (root) { bind(root, params); }

  };

(function () {
  'use strict';
  var V = (window.HSKVIEWS = window.HSKVIEWS || {});
  var U = HSK.util;
  function A() { return window.HSKAPP; }

  function buildPlan(u) {
    var ob = u.onboard || {};
    var cat = HSK.catById(ob.goalCat) || HSK.CATS[0];
    var goal = HSK.courseById(ob.goalCourse) || HSK.COURSES[0];
    var pool = HSK.COURSES.filter(function (c) { return c.cat === cat.id; }).sort(function (a, b) { return a.level - b.level; });
    var lvl = ob.level || 2;
    var steps = [];
    var startIdx = Math.max(0, Math.min(pool.length - 1, lvl - 1));
    var first = pool[0];
    var second = pool[Math.min(pool.length - 1, startIdx)];

    steps.push({
      icon: '🚀', week: 'هفتهٔ ۱', title: 'پایه‌ها: ' + first.title,
      text: 'بدون عجله پایه را می‌سازیم. سطح ' + U.fa(lvl) + ' تشخیص داده شده، پس درس‌های پایه را سریع‌تر مرور می‌کنیم.',
      task: '۴ درس اول دوره را کامل کن و کد هر درس را یک بار خودت بنویس.',
      courses: [first.id]
    });
    if (second && second.id !== first.id) {
      steps.push({
        icon: '🧱', week: 'هفتهٔ ۲-۳', title: 'عمق بیشتر: ' + second.title,
        text: 'سراغ مفاهیمی می‌رویم که تفاوت یک تازه‌کار و یک برنامه‌نویس واقعی را می‌سازند.',
        task: 'نصف دورهٔ ' + second.title + ' را جلو ببر و برای هر ماژول یک یادداشت کوتاه بنویس.',
        courses: [second.id]
      });
    }
    steps.push({
      icon: '🛠', week: 'هفتهٔ ۴', title: 'پروژهٔ کوچک',
      text: 'یادگیری بدون ساختن، فراموش می‌شود. یک پروژهٔ کوچک با ' + goal.title + ' می‌سازیم.',
      task: 'یک برنامهٔ زیر ۵۰ خط بساز که ورودی بگیرد و خروجی نشان دهد (مثلاً ماشین‌حساب یا لیست کارها).',
      courses: []
    });
    steps.push({
      icon: '🧠', week: 'هفتهٔ ۵-۶', title: 'مباحث حرفه‌ای',
      text: 'مباحثی که در مصاحبه‌ها و پروژه‌های واقعی پرتکرارند: ساختار کد، دیباگ و بهینه‌سازی.',
      task: 'دو دورهٔ سطح ۴ از دستهٔ ' + cat.short + ' را شروع کن و تست‌هایشان را بزن.',
      courses: pool.filter(function (c) { return c.level >= 4; }).slice(0, 2).map(function (c) { return c.id; })
    });
    steps.push({
      icon: '🏁', week: 'هفتهٔ ۷-۸', title: 'پروژهٔ نهایی و نمایش',
      text: 'یک پروژهٔ کامل بساز، منتشر کن و در لیگ با امتیازهایش بدرخش.',
      task: 'پروژه‌ات را جایی منتشر کن و لینکش را برای یک دوست بفرست تا تست کند.',
      courses: []
    });
    return { cat: cat, goal: goal, steps: steps, level: lvl };
  }

  function stepState(step, doneCount) {
    return step.courses.length ? (step.courses.every(function (id) {
      var c = HSK.courseById(id);
      return c && A().courseProgress(c).done === c.topics.length;
    }) ? 'completed' : '') : '';
  }

  V.path = function () {
    var app = A(), u = app.state.user;
    var plan = buildPlan(u);
    var mine = HSK.COURSES.filter(function (c) { return Object.keys(u.started).indexOf(c.id) >= 0; });
    var stepsDone = plan.steps.filter(function (s) { return stepState(s) === 'completed'; }).length;
    var pct = Math.round((stepsDone / plan.steps.length) * 100);

    return {
      html: '<div class="page"><div class="stack-lg">' +
        '<section class="row between wrap">' +
        '<div><span class="kicker">' + plan.cat.icon + ' ' + plan.cat.title + '</span>' +
        '<h1 style="margin:6px 0">مسیر شخصی تو</h1>' +
        '<p class="muted" style="margin:0">بر اساس هدف («' + plan.goal.title + '») و سطحی که تست تعیین کرد (سطح ' + U.fa(plan.level) + ') این نقشه ساخته شده. هر هفته پیشرفتت را با همین صفحه بسنج.</p></div>' +
        '<div class="col">' +
        '<div class="row wrap"><button class="btn violet" data-x="download">⬇ دریافت نقشه (فایل متنی)</button>' +
        '<button class="btn ghost" data-go="#/courses">همهٔ دوره‌ها</button></div>' +
        '<div class="roadmap-progress"><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span>' + U.fa(stepsDone) + ' از ' + U.fa(plan.steps.length) + ' گام</span></div></div>' +
        '</section>' +

        '<section class="callout amber"><span>🤖</span><p><strong>یادداشت هوشیکا: </strong>مسیر خط‌کشی است، نه زندان. اگر یک هفته عقب افتادی، خودت را سرزنش نکن؛ فقط گام بعدی را بردار. ربات‌ها هیچ‌وقت خسته نمی‌شوند، ولی تو انسان هستی و طبیعی است.</p></section>' +

        '<section>' + plan.steps.map(function (s, i) {
          var st = stepState(s);
          return '<div class="road-step ' + st + '">' +
            '<span class="step-marker">' + (st ? '✓' : U.fa(i + 1)) + '</span>' +
            '<div class="step-body"><span class="small muted">' + s.week + '</span>' +
            '<h3>' + s.icon + ' ' + s.title + '</h3>' +
            '<p>' + s.text + '</p>' +
            '<div class="step-task">' + s.task + '</div>' +
            (s.courses.length ? '<div class="row wrap" style="margin-top:10px">' + s.courses.map(function (id) {
              var c = HSK.courseById(id);
              if (!c) return '';
              var p = app.courseProgress(c);
              return '<span class="chip sm" data-course="' + id + '">' + c.code + ' ' + c.title + ' — ' + U.fa(p.pct) + '٪</span>';
            }).join('') + '</div>' : '') +
            '</div>' +
            (s.courses.length ? '<button class="btn ' + (st ? 'ghost' : 'primary') + ' sm" data-course="' + s.courses[0] + '">' + (st ? 'مرور' : 'برو') + '</button>' : '') +
            '</div>';
        }).join('') + '</section>' +

        '<section class="panel"><div class="sec-head"><h2 style="font-size:24px">دوره‌های در جریان</h2>' +
        '<span class="badge ghost">' + U.fa(mine.length) + ' دوره</span></div>' +
        (mine.length ? '<div class="grid g3">' + mine.map(function (c) {
          var p = app.courseProgress(c);
          return '<div class="card link tilt" data-course="' + c.id + '">' +
            '<div class="cc-top"><span class="icon-badge">' + c.code + '</span>' +
            '<div class="grow"><h3 style="margin:0">' + c.title + '</h3>' +
            '<p class="muted small" style="margin:4px 0 0">' + U.fa(p.done) + ' از ' + U.fa(p.total) + ' درس</p></div></div>' +
            '<div class="progress-line" style="margin-top:10px"><div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
            '<span>' + U.fa(p.pct) + '٪</span></div></div>';
        }).join('') + '</div>' : '<p class="muted">هنوز دوره‌ای شروع نکرده‌ای. <a href="#/courses">از فهرست دوره‌ها</a> یکی را انتخاب کن.</p>') +
        '</section>' +

        '<section class="panel flat">' + HKSAY.svg({ mood: 'proud', size: '180px' }) +
        HKSAY.bubble('راستی، هر گامی که تمام می‌کنی امتیاز می‌گیری؛ و امتیازت مستقیم می‌رود در جدول لیگ هفتگی و ماهانه. یعنی هم یاد می‌گیری، هم رقابت می‌کنی.') + '</section>' +
        '</div></div>',
      bind: function (root) {

        });
        app.on(root, '[data-x="download"]', 'click', function () {
          var lines = ['هوشیکا — نقشهٔ مسیر یادگیری', 'هدف: ' + plan.goal.title + ' (' + plan.cat.title + ')',
            'سطح: ' + U.fa(plan.level), 'تاریخ: ' + U.persianDate(new Date()), ''];
          plan.steps.forEach(function (s, i) {
            lines.push((i + 1) + ') ' + s.week + ' — ' + s.title);
            lines.push('   ' + s.text);
            lines.push('   تمرین: ' + s.task);
            lines.push('');
          });
          var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'hooshika-curriculum.txt';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
          app.addXp(10, 'path', 'دریافت نقشهٔ مسیر');
          app.toast({ icon: '⬇', title: 'نقشه دانلود شد', text: 'فایل متنی مسیر در پوشهٔ دانلود ذخیره شد. +۱۰ امتیاز' });
        });

(function () {

  function A() { return window.HSKAPP; }

    var target = kind === 'week' ? U.weekEnd() : U.monthEnd();
    var c = U.countdown(target);
    return '<div class="countdown">' +
      '<div class="cd-cell"><strong>' + U.fa(c.days) + '</strong><span>روز</span></div>' +
      '<div class="cd-cell"><strong>' + U.fa(c.h) + '</strong><span>ساعت</span></div>' +
      '<div class="cd-cell"><strong>' + U.fa(c.m) + '</strong><span>دقیقه</span></div>' +
      '</div>';
  }
  function rowsHTML(L, u) {
    return L.rows.map(function (r) {
      var zone = r.rank <= 3 ? 'promo' : (r.rank >= L.rows.length - 2 ? 'drop' : '');
      var delta = r.me ? Math.round(A().xpInPeriod(tab)) : Math.round(r.xp * 0.07);
      return '<div class="league-row ' + (r.me ? 'me' : '') + ' ' + zone + '">' +
        '<span class="rank ' + (r.rank <= 3 ? 'top' : '') + '">' + (r.rank <= 3 ? ['🥇', '🥈', '🥉'][r.rank - 1] : U.fa(r.rank)) + '</span>' +

        'لیگ هفتگی هر جمعه و لیگ ماهانه پایان هر ماه میلادی-شمسی بسته می‌شود.</p></div>' +
        '<div class="tabs" style="max-width:330px">' +
        '<button class="' + (tab === 'week' ? 'on' : '') + '" data-ltab="week">هفتگی</button>' +
        '<button class="' + (tab === 'month' ? 'on' : '') + '" data-ltab="month">ماهانه</button>' +

        '<section class="league-head">' +
        '<div class="tier-badge"><span class="t-icon">' + tier.icon + '</span>' +
        '<div><strong>' + tier.title + '</strong>' +
        '<div class="small muted">' + (nextTier ? U.faNum(Math.max(0, nextTier.min - u.xp)) + ' امتیاز تا ' + nextTier.title : 'بالاترین لیگ!') + '</div></div></div>' +
        '<div class="panel tight"><div class="small muted">جایگاه تو در این دوره</div>' +
        '<strong style="font-family:var(--font-display);font-size:30px;color:var(--cyan)">' + U.fa(L.rank) + '</strong>' +

        '<section class="grid" style="grid-template-columns:1.5fr .5fr">' +
        '<div class="panel"><div class="sec-head"><h2 style="font-size:24px">جدول ' + (tab === 'week' ? 'این هفته' : 'این ماه') + '</h2>' +
        '<div class="zone-note"><span><i style="background:var(--lime)"></i>صعود به لیگ بالاتر</span>' +
        '<span><i style="background:var(--danger)"></i>منطقهٔ سقوط</span></div></div>' +
        '<div class="league-table" id="leagueTable">' + rowsHTML(L, u) + '</div>' +
        '<p class="hint" style="margin-top:12px">سه نفر اول به لیگ بالاتر صعود می‌کنند و دو نفر آخر به لیگ پایین‌تر می‌روند. رقبا ربات‌های تمرینی هوشیکا هستند تا همیشه یک مسابقهٔ نزدیک داشته باشی.</p>' +
        '</div>' +
        '<div class="col">' +
        '<div class="panel tight">' + HKSAY.svg({ mood: L.rank <= 3 ? 'proud' : 'think', size: '140px' }) +
        HKSAY.bubble(U.pick(HSK.LINES.league, String(L.rank))) + '</div>' +
        '<div class="panel tight"><h3 style="font-size:20px">امتیاز از کجا می‌آید؟</h3>' +
        '<ul class="goals" style="margin-top:10px">' +
        '<li>هر درس کامل: <b class="ink2">+۱۰</b></li>' +
        '<li>هر پاسخ درست در تست: <b class="ink2">+۵</b></li>' +
        '<li>تست بی‌نقص درس: <b class="ink2">+۱۰</b></li>' +
        '<li>مأموریت روزانه: <b class="ink2">+۱۵ تا +۴۵</b></li>' +
        '<li>چالش هفته: <b class="ink2">+۵۰ تا +۸۰</b></li>' +
        '<li>هر اجرای کد در کارگاه: <b class="ink2">+۵</b></li>' +
        '</ul></div>' +
        '<div class="callout"><span>💡</span><p>می‌خواهی سریع بالا بروی؟ هر روز یک درس + مأموریت‌ها را بگیر؛ همان اندازه که ۱۰ درس در یک روز می‌زنی امتیاز می‌گیری، ولی زنجیره‌ات هم حفظ می‌شود.</p></div>' +
        '</div></section>' +
        '</div></div>',
      bind: function (root) {
        app.on(root, '[data-ltab]', 'click', function () {
          tab = this.getAttribute('data-ltab');
          app.render();
        });
        /* شمارش معکوس زنده */
        var cells = app.$$('.cd-cell strong', root);
        var timer = setInterval(function () {
          if (!document.body.contains(cells[0])) { clearInterval(timer); return; }
          var c = U.countdown(tab === 'week' ? U.weekEnd() : U.monthEnd());
          cells[0].textContent = U.fa(c.days);
          cells[1].textContent = U.fa(c.h);
          cells[2].textContent = U.fa(c.m);
        }, 30000);
        HSKFX.refresh(root);
      }
    };
  };
})();

/* ===== v-profile.js ===== */
/* =====================================================================
   هوشیکا · نما: پروفایل، دستاوردها و تنظیمات
   ===================================================================== */
(function () {
  'use strict';
  var V = (window.HSKVIEWS = window.HSKVIEWS || {});
  var U = HSK.util;
  function A() { return window.HSKAPP; }

  var COLORS = ['#4de2ff', '#8b7dff', '#9bff7a', '#ffc94d', '#ff7bb0', '#ff8a5c'];

  function tabsBar(sub) {
    var items = [['profile', 'پروفایل'], ['ach', 'دستاوردها'], ['settings', 'تنظیمات']];
    return '<div class="tabs" style="max-width:520px">' + items.map(function (x) {
      return '<button class="' + ((sub || 'profile') === x[0] ? 'on' : '') + '" data-ptab="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>';
  }

  function profileTab(u) {
    var app = A(), lvl = app.levelInfo(), s = app.summary();
    var L = app.leagueRows('week');
    return '' +
      '<div class="stack-lg">' +
      '<section class="panel profile-head">' +
      HKSAY.svg({ mood: 'happy', size: '150px' }) +
      '<div class="grow">' +
      '<div class="row wrap"><input class="input" id="nameInput" value="' + app.esc(u.name) + '" style="max-width:260px" />' +
      '<button class="btn primary" data-x="saveName">ذخیرهٔ نام</button></div>' +
      '<p class="muted small" style="margin:10px 0 0">' + (u.method === 'guest' ? 'حساب مهمان (فقط روی این دستگاه)' : (u.method === 'phone' ? 'شمارهٔ ' : 'ایمیل ') + app.esc(u.contact)) +
      ' · عضویت از ' + U.persianDate(new Date(u.createdAt)) + '</p>' +
      '<div class="row wrap" style="margin-top:12px">' +
      '<span class="badge amber">سطح ' + U.fa(lvl.index) + ' — ' + lvl.title + '</span>' +
      '<span class="badge cyan">' + U.faNum(u.xp) + ' امتیاز</span>' +
      '<span class="badge pink">🔥 ' + U.fa(u.streak || 0) + ' روز پیوسته</span>' +
      '<span class="badge lime">🏆 رتبهٔ ' + U.fa(L.rank) + '</span>' +
      '</div></div>' +
      '<div class="col" style="align-items:flex-end"><button class="btn ghost sm" data-go="#/league">جدول لیگ</button>' +
      '<button class="btn ghost sm" data-x="logout">خروج از حساب</button></div>' +
      '</section>' +

      '<section class="panel"><h3>شخصیت ربات تو</h3>' +
      '<p class="muted small">آواتارت در جدول لیگ و کنار اسمت نشان داده می‌شود. یک حالت انتخاب کن یا رنگش را عوض کن.</p>' +
      '<div class="avatar-picker" style="margin-top:12px">' +
      HSK.AVATARS.map(function (a) {
        return '<button class="avatar-opt ' + (u.avatar === a ? 'on' : '') + '" data-avatar="' + a + '">' + HKSAY.avatar(a, u.avatarColor) + '</button>';
      }).join('') + '</div>' +
      '<div class="avatar-picker" style="margin-top:12px">' +
      COLORS.map(function (c) {
        return '<button class="avatar-opt ' + (u.avatarColor === c ? 'on' : '') + '" data-color="' + c + '">' +
          '<span style="display:block;width:26px;height:26px;border-radius:50%;background:' + c + ';box-shadow:0 0 16px ' + c + '"></span></button>';
      }).join('') + '</div></section>' +

      '<section class="grid g3 stat-grid">' +
      '<div class="card stat-card"><span class="s-icon">📚</span><div><strong>' + U.fa(s.lessonsDone) + '</strong><span>درس کامل‌شده</span></div></div>' +
      '<div class="card stat-card"><span class="s-icon">🎖</span><div><strong>' + U.fa(u.achievements.length) + '</strong><span>نشان گرفته‌شده</span></div></div>' +
      '<div class="card stat-card"><span class="s-icon">🎯</span><div><strong>' + U.fa(u.answered ? Math.round((u.correct / u.answered) * 100) : 0) + '٪</strong><span>دقت پاسخ‌ها</span></div></div>' +
      '<div class="card stat-card"><span class="s-icon">🏁</span><div><strong>' + U.fa(s.coursesDone) + '</strong><span>دوره تمام‌شده</span></div></div>' +
      '<div class="card stat-card"><span class="s-icon">📝</span><div><strong>' + U.fa(u.answered || 0) + '</strong><span>پاسخ ثبت‌شده</span></div></div>' +
      '<div class="card stat-card"><span class="s-icon">⚡</span><div><strong>' + U.fa(u.bestCombo || 0) + '</strong><span>بهترین زنجیرهٔ درست</span></div></div>' +
      '</section>' +

      '<section class="panel"><div class="sec-head"><h2 style="font-size:24px">آخرین نشان‌ها</h2>' +
      '<button class="btn ghost sm" data-ptab="ach">همه</button></div>' +
      '<div class="ach-strip">' + HSK.ACHIEVEMENTS.slice(0, 8).map(function (a) {
        var got = u.achievements.indexOf(a.id) >= 0;
        return '<div class="ach-tile ' + (got ? 'get' : 'locked') + '"><span class="a-icon">' + (got ? a.icon : '🔒') + '</span>' +
          '<strong>' + a.title + '</strong><small>' + a.desc + '</small></div>';
      }).join('') + '</div></section>' +
      '</div>';
  }

  function achTab(u) {
    var got = u.achievements.length;
    var ch = HSK.challengeFor(U.weekKey());
    var chDone = !!u.flags['ch-' + ch.id + '-' + U.weekKey()];
    return '' +
      '<div class="stack-lg">' +
      '<section class="panel"><div class="sec-head"><div><span class="kicker">🎖 نشان‌ها</span>' +
      '<h2 style="margin:6px 0">' + U.fa(got) + ' از ' + U.fa(HSK.ACHIEVEMENTS.length) + ' نشان</h2></div>' +
      '<div class="bar" style="width:220px;align-self:center"><i style="width:' + Math.round((got / HSK.ACHIEVEMENTS.length) * 100) + '%"></i></div></div>' +
      '<p class="muted small">نشان‌ها با درس خواندن، پاسخ درست، پیوستگی روزانه و رقابت در لیگ باز می‌شوند.</p></section>' +
      '<section class="grid g4">' + HSK.ACHIEVEMENTS.map(function (a) {
        var on = u.achievements.indexOf(a.id) >= 0;
        return '<div class="ach-tile ' + (on ? 'get' : 'locked') + '" style="min-width:0">' +
          '<span class="a-icon">' + (on ? a.icon : '🔒') + '</span>' +
          '<strong>' + a.title + '</strong><small>' + a.desc + '</small>' +
          (on ? '<span class="badge lime small" style="margin-top:8px">گرفته شد</span>' : '') + '</div>';
      }).join('') + '</section>' +
      '<section class="panel"><div class="sec-head"><h2 style="font-size:24px">چالش هفته</h2>' +
      (chDone ? '<span class="badge lime">انجام شد ✓</span>' : '<span class="badge amber">+' + U.fa(ch.xp) + ' امتیاز</span>') + '</div>' +
      '<p><strong style="font-family:var(--font-display);font-size:19px">' + ch.title + '</strong></p>' +
      '<p class="muted">' + ch.desc + '</p></section>' +
      '</div>';
  }

  function settingsTab(u) {
    var still = HSKFX.getStill();
    return '' +
      '<div class="stack-lg">' +
      '<section class="panel"><h3>تنظیمات نمایش</h3>' +
      '<div class="setting-row"><div class="grow"><strong>حالت آرام (بدون انیمیشن)</strong>' +
      '<span>اگر حرکت‌ها اذیتت می‌کند یا دستگاهت کند است، این را روشن کن.</span></div>' +
      '<button class="switch ' + (still ? 'on' : '') + '" data-x="still"><i></i></button></div>' +
      '<div class="setting-row"><div class="grow"><strong>صدای ربات</strong>' +
      '<span>در نسخهٔ بعدی: صداهای کوتاه برای امتیاز و پاسخ درست.</span></div>' +
      '<span class="badge ghost">به‌زودی</span></div>' +
      '</section>' +

      '<section class="panel"><h3>پیشرفت من</h3>' +
      '<div class="row wrap">' +
      '<button class="btn ghost" data-x="export">⬇ دریافت فایل پیشرفت (JSON)</button>' +
      '<button class="btn ghost" data-x="reset">↺ صفر کردن پیشرفت</button>' +
      '<button class="btn ghost" data-x="logout">🚪 خروج</button>' +
      '<button class="btn ghost" data-x="delete" style="color:#ff9a9a;border-color:#ff6b6b66">🗑 حذف حساب</button>' +
      '</div>' +
      '<p class="hint" style="margin-top:12px">همهٔ اطلاعات روی همین مرورگر ذخیره می‌شود. اگر حافظهٔ مرورگر را پاک کنی، حساب هم پاک می‌شود؛ پس اگر خواستی پیشرفتت را جایی نگه داری، فایل JSON را بگیر.</p>' +
      '</section>' +

      '<section class="panel flat">' + HKSAY.svg({ mood: 'think', size: '150px' }) +
      '<h3>دربارهٔ هوشیکا</h3>' +
      '<p class="muted">هوشیکا یک ربات معلم است: سطحت را می‌سنجد، مسیر می‌سازد، امتیاز می‌دهد و در لیگ کنارت می‌جنگد. ' +
      'این نسخه کاملاً آفلاین کار می‌کند و همهٔ داده‌ها در مرورگر خودت می‌ماند. نسخهٔ بعدی: حساب ابری، کلاس‌های گروهی و رقابت واقعی چندنفره.</p>' +
      '<div class="row wrap"><span class="badge cyan">هوشیکا ۲٫۰</span><span class="badge ghost">' + U.fa(HSK.COURSES.length) + ' دوره</span>' +
      '<span class="badge ghost">' + U.fa(HSK.COURSES.reduce(function (s, c) { return s + c.topics.length; }, 0)) + ' درس</span>' +
      '<span class="badge ghost">' + U.fa(HSK.ACHIEVEMENTS.length) + ' نشان</span></div></section>' +
      '</div>';
  }

  function bind(root, sub) {
    var app = A(), u = app.state.user;
    app.on(root, '[data-ptab]', 'click', function () { app.go('#/profile/' + (this.getAttribute('data-ptab') === 'profile' ? '' : this.getAttribute('data-ptab'))); });
    app.on(root, '[data-avatar]', 'click', function () {
      u.avatar = this.getAttribute('data-avatar');
      app.saveUser(); app.render();
      app.toast({ icon: '🤖', title: 'آواتار عوض شد', text: 'از این به بعد در لیگ با این شخصیت دیده می‌شوی.' });
    });
    app.on(root, '[data-color]', 'click', function () {
      u.avatarColor = this.getAttribute('data-color');
      app.saveUser(); app.render();
    });
    app.on(root, '[data-x="saveName"]', 'click', function () {
      var inp = app.$('#nameInput', root);
      var v = (inp.value || '').trim();
      if (v.length < 2) return app.toast({ icon: '✋', title: 'نام کوتاه است', text: 'حداقل ۲ حرف بنویس.', cls: 'bad' });
      u.name = v;
      app.saveUser(); app.render();
      app.toast({ icon: '✅', title: 'نام ذخیره شد', text: 'سلام ' + v + '!' });
    });
    app.on(root, '[data-x="still"]', 'click', function () { app.toggleStill(); });
    app.on(root, '[data-x="logout"]', 'click', function () {
      app.confirmBox('خروج از حساب', 'از حساب خارج می‌شوی؟ پیشرفتت ذخیره می‌ماند و بعداً می‌توانی برگردی.', 'خروج', app.logout);
    });
    app.on(root, '[data-x="reset"]', 'click', function () {
      app.confirmBox('صفر کردن پیشرفت', 'همهٔ امتیازها، درس‌ها و نشان‌ها پاک می‌شود. مطمئنی؟', 'بله، صفر کن', function () {
        u.xp = 0; u.xpLog = []; u.lessons = {}; u.started = {}; u.days = []; u.streak = 0; u.lastDay = '';
        u.achievements = []; u.flags = {}; u.answered = 0; u.correct = 0; u.combo = 0; u.bestCombo = 0; u.missionsDone = 0;
        u.onboard.done = false;
        app.saveUser();
        app.toast({ icon: '↺', title: 'همه‌چیز صفر شد', text: 'بیا از نو شروع کنیم.' });
        app.go('#/onboarding');
        app.render();
      });
    });
    app.on(root, '[data-x="delete"]', 'click', function () {
      app.confirmBox('حذف حساب', 'حساب و همهٔ داده‌هایش برای همیشه پاک می‌شود. مطمئنی؟', 'حذف کن', app.deleteAccount);
    });
    app.on(root, '[data-x="export"]', 'click', function () {
      var blob = new Blob([JSON.stringify(u, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hooshika-progress-' + u.contact + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      app.toast({ icon: '⬇', title: 'فایل پیشرفت ساخته شد', text: 'در پوشهٔ دانلود ذخیره شد.' });
    });
    HSKFX.refresh(root);
  }

  V.profile = function (params) {
    var app = A(), u = app.state.user;
    var raw = params.sub || params.id || 'profile';
    var sub = ['profile', 'ach', 'settings'].indexOf(raw) >= 0 ? raw : 'profile';
    var body = sub === 'ach' ? achTab(u) : (sub === 'settings' ? settingsTab(u) : profileTab(u));
    return {
      html: '<div class="page">' +
        '<div class="stack-lg">' +
        '<section class="row between wrap"><div><span class="kicker">حساب من</span>' +
        '<h1 style="margin:6px 0">' + (sub === 'ach' ? 'دستاوردها' : (sub === 'settings' ? 'تنظیمات' : 'پروفایل')) + '</h1></div>' +
        tabsBar(sub) + '</section>' + body +
        '</div></div>',
      bind: function (root) { bind(root, sub); }
    };
  };
})();
